<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 영지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: full-screen pixel map, wood-and-parchment HUD floating over it (top resources, left quest scroll, bottom build hotbar). Single committed look. */
:root{
  --wood:#6b4423;--wood-hi:#a06c3a;--wood-lo:#3f2615;
  --parch:#f0ddb4;--parch-lo:#d8bd88;--parch-hi:#fff3d4;
  --ink:#3b2714;--ink-soft:#6e5233;
  --gold:#e8b93e;--go:#4f8a34;--go-hi:#74b052;--bad:#b8432c;
  --night:#2c4f27;--glass:rgba(40,26,14,.82);--cream:#f6e7c4;
  --f-ui:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Pixelify Sans',ui-monospace,'SF Mono',monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
img.px{image-rendering:pixelated}

.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 0;display:grid;gap:6px;pointer-events:none;z-index:5}
.res{pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--wood);border:2px solid var(--wood-lo);border-radius:7px;box-shadow:inset 0 2px 0 var(--wood-hi),0 3px 0 rgba(0,0,0,.28);padding:5px 6px;max-width:520px}
.chip{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:4px;align-items:center;min-width:0;color:var(--cream)}
.chip img{width:20px;height:20px;grid-row:span 2}
.chip .n{font-family:var(--f-num);font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .r{font-family:var(--f-num);font-size:10px;line-height:1.2;color:#d9c08c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .r.neg{color:#ff9d84}
.status{display:flex;align-items:center;gap:5px;pointer-events:auto;max-width:520px;min-width:0}
.pill{background:var(--glass);color:var(--cream);border-radius:5px;padding:4px 7px;font-size:12px;line-height:1.1;white-space:nowrap}
.pill b{font-family:var(--f-num);font-weight:700}
.skill{flex:1 1 0;min-width:0;display:grid;gap:3px}
.skill .bar{height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.skill .bar i{display:block;height:100%;background:var(--gold)}
.skill.farm .bar i{background:#8fcf5f}.skill.trade .bar i{background:#c9a0f0}
.iconbtn{appearance:none;border:2px solid var(--wood-lo);background:var(--wood);color:var(--cream);border-radius:6px;box-shadow:inset 0 2px 0 var(--wood-hi),0 2px 0 rgba(0,0,0,.25);font-family:var(--f-num);font-weight:700;font-size:16px;width:34px;height:30px;padding:0;cursor:pointer;flex:none}
.iconbtn:active{transform:translateY(1px)}
.iconbtn:focus-visible,.btn:focus-visible,.slot:focus-visible,.qhead:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.quests{pointer-events:auto;justify-self:start;width:min(236px,64vw);background:var(--parch);border:2px solid var(--wood-lo);border-radius:6px;box-shadow:inset 0 0 0 2px var(--parch-lo),0 3px 0 rgba(0,0,0,.25);overflow:hidden}
.qhead{appearance:none;width:100%;display:flex;align-items:center;gap:6px;background:linear-gradient(var(--parch-lo),var(--parch));border:0;border-bottom:2px solid var(--parch-lo);padding:5px 9px;font-family:var(--f-ui);font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.qhead .cnt{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-soft)}
.qhead .car{font-size:11px;color:var(--ink-soft);transition:transform .15s}
.quests.closed .car{transform:rotate(-90deg)}
.quests.closed ul{display:none}
.quests ul{list-style:none;margin:0;padding:6px 9px 8px;display:grid;gap:6px}
.quests li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;line-height:1.2}
.quests .box{width:10px;height:10px;border:2px solid var(--ink-soft);border-radius:2px;background:var(--parch-hi)}
.quests li.done .box{background:var(--go);border-color:#2f5a1e}
.quests .pg{font-family:var(--f-num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.claim{appearance:none;border:2px solid #8a6416;background:var(--gold);color:var(--ink);border-radius:4px;font-family:var(--f-ui);font-size:12px;padding:2px 6px;cursor:pointer;box-shadow:0 2px 0 #8a6416;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}

.zoom{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:grid;gap:6px;z-index:5}
.zoom .iconbtn{width:40px;height:40px;font-size:20px}

.bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none;z-index:6;display:flex;justify-content:center}
.bar-in{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:var(--wood);border:2px solid var(--wood-lo);border-radius:9px;box-shadow:inset 0 2px 0 var(--wood-hi),0 4px 0 rgba(0,0,0,.3);padding:8px 6px 6px;max-width:100%;min-width:0}
.bar-in::-webkit-scrollbar{display:none}
.slot{appearance:none;flex:0 0 66px;display:grid;justify-items:center;align-content:start;gap:2px;padding:4px 2px 5px;background:var(--parch);border:2px solid var(--wood-lo);border-radius:5px;box-shadow:inset 0 -3px 0 var(--parch-lo);font-family:var(--f-ui);color:var(--ink);font-size:12px;line-height:1.1;cursor:pointer;transition:transform .12s}
.slot .th{width:32px;height:40px;image-rendering:pixelated}
.slot .th.sq{width:30px;height:30px;margin:5px 0}
.slot[aria-pressed="true"]{background:var(--parch-hi);border-color:#8a6416;box-shadow:0 0 0 2px var(--gold),inset 0 -3px 0 var(--parch-lo);transform:translateY(-4px)}
.cost{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 4px;font-family:var(--f-num);font-weight:700;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cost span{display:inline-flex;align-items:center;gap:1px}
.cost img{width:10px;height:10px;image-rendering:pixelated}
.slot.poor .cost{color:var(--bad)}
.slot.locked .th{filter:grayscale(1);opacity:.5}
.slot.locked .cost{color:var(--ink-soft)}

.confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);z-index:7;display:flex;align-items:center;gap:8px;background:var(--parch);border:2px solid var(--wood-lo);border-radius:8px;box-shadow:inset 0 0 0 2px var(--parch-lo),0 4px 0 rgba(0,0,0,.28);padding:6px 6px 6px 12px;max-width:calc(100% - 32px);width:max-content}
.confirm .msg{font-size:14px;min-width:0}
.confirm .msg small{display:block;font-size:11px;color:var(--ink-soft)}
.confirm .msg small.bad{color:var(--bad)}

.btn{appearance:none;border:2px solid var(--wood-lo);background:var(--wood);color:var(--cream);border-radius:6px;box-shadow:inset 0 2px 0 var(--wood-hi),0 3px 0 rgba(0,0,0,.25);font-family:var(--f-ui);font-size:14px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 0 var(--wood-hi),0 1px 0 rgba(0,0,0,.25)}
.btn.go{background:var(--go);border-color:#2f5a1e;box-shadow:inset 0 2px 0 var(--go-hi),0 3px 0 rgba(0,0,0,.25)}
.btn.warn{background:var(--bad);border-color:#6e2214;box-shadow:inset 0 2px 0 #d8664c,0 3px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:default}
.btn img{width:12px;height:12px;image-rendering:pixelated}
.btn .num{font-family:var(--f-num);font-weight:700;font-size:12px}

.sheet{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(440px,calc(100% - 32px));max-height:62vh;overflow:auto;z-index:8;background:var(--parch);border:2px solid var(--wood-lo);border-radius:9px;box-shadow:inset 0 0 0 2px var(--parch-lo),0 6px 0 rgba(0,0,0,.3);padding:14px 16px 16px}
.sheet .top{display:flex;align-items:center;gap:10px}
.sheet .top img{width:48px;height:60px;image-rendering:pixelated;flex:none}
.sheet h2{margin:0;font-weight:400;font-size:21px;text-wrap:balance}
.sheet .lv{font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.sheet .x{margin-left:auto;align-self:start}
.sheet p{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--ink)}
.sheet .stat{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--parch-hi);border:2px solid var(--parch-lo);border-radius:5px;padding:3px 8px;font-size:13px}
.tag img{width:12px;height:12px;image-rendering:pixelated}
.tag .num{font-family:var(--f-num);font-weight:700}
.tag.ok{border-color:#9cc47e}.tag.no{border-color:#e0957f;color:var(--bad)}
.sheet .acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.sheet h3{margin:16px 0 6px;font-weight:400;font-size:15px;color:var(--ink-soft);letter-spacing:.02em}
.trades{display:grid;gap:6px}
.trade{display:flex;align-items:center;gap:8px;font-size:14px}
.trade .btn{margin-left:auto}
.sheet ul.help{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.55}

.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,6px);z-index:9;background:var(--glass);color:var(--cream);border-radius:7px;padding:8px 14px;font-size:14px;line-height:1.35;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.claim{animation:none}.slot,.toast,.qhead .car{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-label="마을 지도"></canvas>

<div class="hud">
  <div class="res" id="res"></div>
  <div class="status">
    <span class="pill" id="day"></span>
    <div class="pill skill farm"><span id="sk-farm"></span><div class="bar"><i id="skb-farm"></i></div></div>
    <div class="pill skill build"><span id="sk-build"></span><div class="bar"><i id="skb-build"></i></div></div>
    <div class="pill skill trade"><span id="sk-trade"></span><div class="bar"><i id="skb-trade"></i></div></div>
    <button class="iconbtn" id="menu" aria-label="메뉴">≡</button>
  </div>
  <section class="quests" id="quests">
    <button class="qhead" id="qhead" aria-expanded="true"><span class="car">▼</span>퀘스트<span class="cnt" id="qcnt"></span></button>
    <ul id="qlist"></ul>
  </section>
</div>

<div class="zoom">
  <button class="iconbtn" id="zin" aria-label="확대">+</button>
  <button class="iconbtn" id="zout" aria-label="축소">−</button>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="msg" id="cmsg"></div>
  <button class="btn" id="cno">취소</button>
  <button class="btn go" id="cyes">짓기</button>
</div>

<div class="bar"><div class="bar-in" id="hotbar"></div></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const TS=16,MW=28,MH=28,DAY=30,SEASONS=['봄','여름','가을','겨울'];
const SAVE='jageun-yeongji-v1';
const $=s=>document.querySelector(s);
const OUT='#3a2618';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn((x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x,y,w2,h2)},g);return c}
function blob(p,cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)p(cx+x,cy+y,1,1,col)}

/* ---------- definitions ---------- */
const B={
  hall:{n:'마을회관',d:'마을의 중심이에요. 레벨을 올리면 주민이 더 살 수 있고 빵집과 선술집이 열려요.',cap:5,need:0},
  house:{n:'오두막',d:'주민이 사는 집이에요. 레벨마다 3명이 더 살 수 있어요.',cost:{wood:20},cap:3,need:0,hall:1,smoke:1},
  farm:{n:'밀밭',d:'식량을 키워요. 겨울에는 땅이 얼어서 쉬어요.',cost:{wood:15},need:2,prod:{food:1.2},hall:1},
  lumber:{n:'벌목소',d:'일꾼이 나무를 베어 목재를 모아요.',cost:{wood:25,stone:10},need:2,prod:{wood:.8},hall:1},
  quarry:{n:'채석장',d:'언덕에서 돌을 캐 석재를 모아요.',cost:{wood:30},need:2,prod:{stone:.6},hall:1},
  market:{n:'시장',d:'장사로 금화를 벌어요. 남는 자원을 여기서 팔 수 있어요.',cost:{wood:40,stone:20},need:2,prod:{gold:.8},hall:1},
  bakery:{n:'빵집',d:'계절과 상관없이 빵을 구워요. 겨울을 나려면 꼭 필요해요.',cost:{wood:35,stone:30,gold:20},need:2,prod:{food:1.6},hall:2,smoke:1},
  tavern:{n:'선술집',d:'금화를 벌고, 소문이 나서 주민이 더 빨리 모여요.',cost:{wood:60,stone:40,gold:50},need:3,prod:{gold:1.6},hall:2,smoke:1},
};
const ORDER=['house','farm','lumber','quarry','market','bakery','tavern'];
const HALLUP=[null,{wood:80,stone:60,gold:60},{wood:160,stone:140,gold:200}];
const RES=['wood','stone','food','gold'];
const RN={wood:'목재',stone:'석재',food:'식량',gold:'금화'};
const RCOL={wood:'#f0c27a',stone:'#d8d4cc',food:'#ffd27a',gold:'#ffe066'};
const TRADES=[{k:'wood',n:10,g:5},{k:'stone',n:10,g:8},{k:'food',n:10,g:4}];

/* ---------- icons ---------- */
const ICON={
  wood:mk(10,10,p=>{p(1,3,8,5,'#8b5a2b');p(1,3,8,1,'#b07a44');p(1,7,8,1,'#5e3a1c');p(0,3,2,5,'#e2bf86');p(0,5,1,1,'#a87a45');p(4,5,3,1,'#6e4422')}),
  stone:mk(10,10,p=>{blob(p,5,6,3,'#6f6a62');blob(p,4,5,3,'#a9a49b');p(3,3,2,1,'#d5d0c7');p(6,7,2,1,'#7f7a72')}),
  food:mk(10,10,p=>{p(1,4,8,4,'#c07a32');p(2,3,6,1,'#d99a4a');p(1,4,8,2,'#d99a4a');p(3,4,1,1,'#f4cf8a');p(5,4,1,1,'#f4cf8a');p(7,4,1,1,'#f4cf8a');p(1,7,8,1,'#8a4d1c')}),
  gold:mk(10,10,p=>{blob(p,5,5,4,'#a8761c');blob(p,5,5,3,'#e8b93e');p(4,3,2,1,'#fbe08a');p(5,4,1,3,'#c4901f')}),
  pop:mk(10,10,p=>{p(3,1,4,4,'#f0c9a0');p(3,1,4,1,'#6b3f1f');p(2,1,1,2,'#6b3f1f');p(2,5,6,4,'#4f7fb5');p(2,5,6,1,'#6f9fd5');p(3,9,1,1,'#3b2c22');p(6,9,1,1,'#3b2c22')}),
  axe:mk(10,10,p=>{for(let i=0;i<7;i++)p(1+i,8-i,1,1,'#8b5a2b');p(5,1,4,4,'#9aa3ab');p(5,1,4,1,'#d0d6db');p(8,1,1,4,'#6c757d');p(6,3,1,1,'#8b5a2b')}),
};
const IURL={};for(const k in ICON)IURL[k]=ICON[k].toDataURL();
const ic=(k,cls='')=>`<img class="px ${cls}" src="${IURL[k]}" alt="${RN[k]||''}">`;

/* ---------- sprites ---------- */
const GR=[['#6db352','#5ea245','#86c869'],['#5fa046','#518e3b','#77b85b'],['#b39a4a','#a1883e','#c9ae5e'],['#e3e9ec','#ccd5db','#f6f9fb']];
const LF=[['#4f9a3e','#37752d','#6cb854'],['#3f8a36','#2b6627','#5aa64a'],['#d0782f','#a35522','#eaa24c'],['#4a7a52','#33573a','#62946a']];
function win(p,x,y,f){p(x-1,y-1,6,6,OUT);p(x,y,4,4,'#6f9fcf');p(x,y,2,1,'#b9dbf5');p(x,y,1,2,'#b9dbf5');p(x+2,y,1,4,f);p(x,y+2,4,1,f)}
function cottage(o,se){const snow=se===3;return mk(32,40,p=>{
  p(3,37,27,3,'rgba(30,20,10,.28)');
  p(3,21,26,16,o.wall);p(3,34,26,3,o.wallD);
  if(o.planks)for(let y=23;y<34;y+=3)p(3,y,26,1,o.wallD);
  if(o.stone)for(let y=22,r=0;y<34;y+=3,r++)for(let x=3+(r%2?3:0);x<29;x+=6){p(x,y,5,2,o.wallL);p(x,y+2,5,1,o.wallD)}
  if(o.timber){p(3,21,2,16,o.frame);p(27,21,2,16,o.frame);p(3,28,26,1,o.frame);for(let i=0;i<6;i++){p(5+i,27-i,1,1,o.frame);p(26-i,27-i,1,1,o.frame)}}
  p(2,21,1,16,OUT);p(29,21,1,16,OUT);p(2,37,28,1,OUT);
  win(p,6,24,o.frame);win(p,22,24,o.frame);
  p(12,28,8,9,OUT);p(13,29,6,8,o.door||'#7a4a24');p(13,29,6,1,'#9c6638');p(15,29,1,8,'#5a3418');p(17,33,1,1,'#f0c862');
  for(let y=5;y<21;y++){const ins=y<8?8-y:0;p(1+ins,y,30-2*ins,1,((y-5)%3===2)?o.roofD:o.roof);p(ins,y,1,1,OUT);p(31-ins,y,1,1,OUT)}
  p(4,5,24,1,o.roofL);p(8,4,16,1,OUT);p(1,20,30,1,o.roofD);p(0,21,32,1,OUT);
  if(snow){for(let y=5;y<10;y++){const ins=y<8?8-y:0;p(1+ins,y,30-2*ins,1,y===9?'#d8e2e8':'#f1f6f9')}for(const x of[3,10,17,25])p(x,10,2,1,'#f1f6f9')}
  if(o.chimney){p(21,0,6,9,OUT);p(22,1,4,8,'#8f857a');p(22,1,4,1,'#b5ab9f');p(22,4,4,1,'#6e665d');if(snow)p(22,0,4,1,'#ffffff')}
})}
function buildSprites(se){
  const G=GR[se],L=LF[se],snow=se===3;
  const S={grass:[],path:[]};
  for(let v=0;v<4;v++)S.grass.push(mk(16,16,p=>{p(0,0,16,16,G[0]);const R=rng(v*97+se*7+1);for(let i=0;i<13;i++)p(R()*16|0,R()*15|0,1,2,G[1]);for(let i=0;i<5;i++)p(R()*16|0,R()*16|0,1,1,G[2]);if(v===3&&se<2){p(5,6,1,1,'#f4e36b');p(11,10,1,1,'#f39ad2');p(3,12,1,1,'#ffffff')}if(v===2&&se===2){p(4,4,2,1,'#c0642a');p(10,11,2,1,'#8f4a1e')}}));

/* ---------- map ---------- */
const riverX=y=>7+Math.round(Math.sin(y/3.3)*1.3);
function genMap(seed){
  const R=rng(seed),t=new Uint8Array(MW*MH),o=new Array(MW*MH).fill(null);
  for(let y=0;y<MH;y++){const rx=riverX(y);t[y*MW+rx]=2;t[y*MW+rx+1]=2}
  for(let x=0;x<MW-3;x++){const i=14*MW+x;t[i]=t[i]===2?3:1}
  for(let y=6;y<23;y++){const i=y*MW+19;if(!t[i])t[i]=1}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;if(t[i])continue;const d=Math.hypot(x-15,y-12);if(d<5)continue;let pr=d>10?.42:d>7?.2:.08;if(x<riverX(y))pr+=.15;const r=R();if(r<pr)o[i]={k:R()<.35?'pine':'tree',hp:3};else if(r<pr+.035)o[i]={k:'rock',hp:4}}
  return{t,o};
}

const lvp=x=>{const l=lv(x),a=40*(l-1)**2,b=40*l*l;return(x-a)/(b-a)};

const hallL=()=>S.b.find(b=>b.k==='hall').l;

const season=()=>Math.floor(S.time/DAY/5)%4;

function upCost(b){if(b.k==='hall')return HALLUP[b.l]||null;if(b.l>=3)return null;const c={};for(const k in B[b.k].cost)c[k]=Math.ceil(B[b.k].cost[k]*1.6*b.l);return c}
function cap(){let c=0;for(const b of S.b)c+=(B[b.k].cap||0)*b.l;return c}
let STAFF={};
function staff(){let a=S.pop;STAFF={};for(const b of S.b){const n=B[b.k].need;if(!n){STAFF[b.id]=true;continue}if(a>=n){a-=n;STAFF[b.id]=true}else STAFF[b.id]=false}S.idle=a}
function bonus(k){return k==='food'?1+.05*(lv(S.xp.farm)-1):k==='gold'?1+.05*(lv(S.xp.trade)-1):1}
function prodOf(b){const P=B[b.k].prod;if(!P||!STAFF[b.id])return{};if(b.k==='farm'&&season()===3)return{};const o={};for(const k in P)o[k]=P[k]*b.l*bonus(k);return o}
function rates(){const r={wood:0,stone:0,food:-S.pop*.12,gold:0};for(const b of S.b){const p=prodOf(b);for(const k in p)r[k]+=p[k]}return r}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function tick(){
  const prevSe=season();
  S.time+=1;staff();
  for(const b of S.b){const p=prodOf(b);for(const k in p){S.r[k]+=p[k];if(k==='food')S.xp.farm+=p[k]*.6;if(k==='gold')S.xp.trade+=p[k]*.4}}
  S.r.food-=S.pop*.12;
  if(S.r.food<0){S.r.food=0;S.starveT++;if(S.starveT>=8&&S.pop>1){S.pop--;S.starveT=0;toast('식량이 떨어져 주민 한 명이 마을을 떠났어요')}}else S.starveT=0;
  const c=cap();S.growT++;
  const every=count('tavern')?3:5;
  if(S.pop<c&&S.r.food>=5&&S.growT>=every){S.pop++;S.growT=0;const h=S.b[0];floatTxt(h.x*TS+16,h.y*TS+4,'+1','#cfe8ff','pop')}
  if(S.pop>c)S.pop=c;
  S.spawnT++;
  if(S.spawnT>=20){S.spawnT=0;const n=S.o.filter(Boolean).length;if(n<150){for(let tries=0;tries<20;tries++){const x=Math.random()*MW|0,y=Math.random()*MH|0,i=y*MW+x;if(TILES[i]||S.o[i]||OCC[i])continue;if(Math.hypot(x-15,y-12)<4)continue;S.o[i]=Math.random()<.85?{k:Math.random()<.35?'pine':'tree',hp:3}:{k:'rock',hp:4};break}}}
  const se=season();if(se!==prevSe)onSeason(se,true);
  syncVils();updateHUD();
  if(S.time%5===0)save();
}
function onSeason(se,announce){if(se===curSeason)return;curSeason=se;SP=buildSprites(se);if(announce)toast(['봄이 왔어요. 밀밭이 다시 자라요','여름이에요. 밀이 쑥쑥 자라요','가을이에요. 밀밭이 황금빛으로 물들어요','겨울이에요. 밀밭이 쉬어요. 빵집이 있으면 든든해요'][se])}

let mode='hand',ghost=null,selId=null,armDel=false,armReset=false;
function harvest(x,y){const i=y*MW+x,o=S.o[i];if(!o)return false;const now=performance.now();o.sh=now;o.hp--;const wx=x*TS+8,wy=y*TS+4;
  if(o.k==='rock'){S.r.stone+=2;S.st.stone+=2;floatTxt(wx,wy,'+2',RCOL.stone,'stone');chips(wx,wy+6,'#a9a49b')}
  else{S.r.wood+=2;S.st.wood+=2;floatTxt(wx,wy-6,'+2',RCOL.wood,'wood');chips(wx,wy+2,LF[curSeason][0])}
  if(o.hp<=0){S.o[i]=null;if(o.k==='rock'){S.r.stone+=2;S.st.stone+=2}else{S.r.wood+=2;S.st.wood+=2}chips(wx,wy+6,o.k==='rock'?'#8f897e':'#8b5a2b',8)}
  updateHUD();return true}
function validAt(x,y){if(x<0||y<0||x+1>=MW||y+1>=MH)return false;for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const i=(y+dy)*MW+x+dx;if(TILES[i]>1||S.o[i]||OCC[i])return false}return true}
function build(){if(!ghost)return;const k=mode,d=B[k];if(!validAt(ghost.x,ghost.y)||!can(d.cost)||hallL()<d.hall)return;pay(d.cost);const b={id:S.nid++,k,x:ghost.x,y:ghost.y,l:1};S.b.push(b);rebuildOcc();S.xp.build+=25;staff();chips(b.x*TS+16,b.y*TS+28,'#d8c49a',10);floatTxt(b.x*TS+16,b.y*TS,d.n,'#fff3d4');toast(`${d.n}을(를) 지었어요`);ghost=null;updateConfirm();updateHUD();save()}
function upgrade(b){const c=upCost(b);if(!c||!can(c))return;pay(c);b.l++;S.xp.build+=40;staff();chips(b.x*TS+16,b.y*TS+20,'#e8b93e',10);toast(`${B[b.k].n} ${b.l}레벨이 되었어요`);updateHUD();save()}
function demolish(b){if(b.k==='hall')return;const c=B[b.k].cost;for(const k in c)S.r[k]+=Math.floor(c[k]/2);S.b=S.b.filter(x=>x!==b);rebuildOcc();staff();toast(`${B[b.k].n}을(를) 허물고 자재 절반을 돌려받았어요`);closeSheet();updateHUD();save()}
function sell(i){const t=TRADES[i];if(S.r[t.k]<t.n)return;const g=Math.round(t.g*(1+.1*(lv(S.xp.trade)-1)));S.r[t.k]-=t.n;S.r.gold+=g;S.st.sold+=t.n;S.xp.trade+=g;const m=S.b.find(b=>b.k==='market');if(m)floatTxt(m.x*TS+16,m.y*TS,'+'+g,RCOL.gold,'gold');updateHUD()}
function claim(id){const q=Q.find(q=>q.id===id);if(!q||S.claimed.includes(id)||q.v()<q.g)return;S.claimed.push(id);give(q.r);const h=S.b[0];chips(h.x*TS+16,h.y*TS,'#e8b93e',12);toast(`퀘스트 완료: ${q.t}`);updateHUD();save()}

let ptr=null;
cv.addEventListener('pointerdown',e=>{if(ptr)return;cv.setPointerCapture(e.pointerId);ptr={id:e.pointerId,x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,drag:false}});
cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;if(!ptr.drag&&Math.hypot(dx,dy)>8)ptr.drag=true;if(ptr.drag){cam.x=ptr.cx-dx/css();cam.y=ptr.cy-dy/css();clampCam()}});
const endPtr=e=>{if(!ptr||e.pointerId!==ptr.id)return;if(!ptr.drag&&e.type==='pointerup')tap(e.clientX,e.clientY);ptr=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(e.deltaY<0?1:-1)},{passive:false});
function tap(cx,cy){const wx=cam.x+cx/css(),wy=cam.y+cy/css(),tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);
  if(mode==='hand'){const id=T(tx,ty)>=0?OCC[ty*MW+tx]:0;if(id){openSheet(id);return}if(T(tx,ty)>=0&&harvest(tx,ty))return;closeSheet();return}
  ghost={x:Math.round(wx/TS-1),y:Math.round(wy/TS-1)};updateConfirm()}
$('#zin').onclick=()=>setZoom(1);$('#zout').onclick=()=>setZoom(-1);

/* ---------- hotbar ---------- */
function costHTML(c){return Object.entries(c||{}).map(([k,v])=>`<span>${ic(k)}${v}</span>`).join('')}
function buildHotbar(){const h=$('#hotbar');let html=`<button class="slot" data-m="hand" aria-pressed="true"><img class="th sq" src="${IURL.axe}" alt=""><span>채집</span><span class="cost">탭해서 수확</span></button>`;
  for(const k of ORDER)html+=`<button class="slot" data-m="${k}" aria-pressed="false"><img class="th" src="${(k==='farm'?THUMB.farm[2]:THUMB[k]).toDataURL()}" alt=""><span>${B[k].n}</span><span class="cost" data-cost>${costHTML(B[k].cost)}</span></button>`;
  h.innerHTML=html;h.addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s)return;const m=s.dataset.m;if(m!=='hand'&&hallL()<B[m].hall){toast(`마을회관 ${B[m].hall}레벨이 되면 지을 수 있어요`);return}mode=(mode===m&&m!=='hand')?'hand':m;ghost=null;closeSheet();updateConfirm();updateSlots();if(mode!=='hand')toast('지을 곳을 탭하세요')})}
function updateSlots(){document.querySelectorAll('.slot').forEach(s=>{const m=s.dataset.m;s.setAttribute('aria-pressed',m===mode);if(m==='hand')return;const locked=hallL()<B[m].hall;s.classList.toggle('locked',locked);s.classList.toggle('poor',!locked&&!can(B[m].cost));const ce=s.querySelector('[data-cost]');const want=locked?`회관 Lv${B[m].hall}`:costHTML(B[m].cost);if(ce.dataset.v!==want){ce.innerHTML=want;ce.dataset.v=want}})}
function updateConfirm(){const c=$('#confirm');if(mode==='hand'||!ghost){c.hidden=true;return}const d=B[mode],ok=validAt(ghost.x,ghost.y),af=can(d.cost);c.hidden=false;
  $('#cmsg').innerHTML=`${d.n} 짓기<small class="${ok&&af?'':'bad'}">${!ok?'여기엔 지을 수 없어요. 나무와 바위를 치우거나 다른 곳을 탭하세요':!af?'자원이 부족해요':'2×2칸을 차지해요'}</small>`;$('#cyes').disabled=!(ok&&af)}

/* ---------- HUD ---------- */
function fmtRate(v){if(Math.abs(v)<.05)return'·';return(v>0?'+':'')+v.toFixed(1)+'/초'}
function updateHUD(){
  const r=rates();let h='';
  for(const k of RES)h+=`<div class="chip">${ic(k)}<span class="n">${Math.floor(S.r[k])}</span><span class="r ${r[k]<0?'neg':''}">${fmtRate(r[k])}</span></div>`;
  h+=`<div class="chip">${ic('pop')}<span class="n">${S.pop}/${cap()}</span><span class="r">쉬는 ${S.idle??0}</span></div>`;
  const re=$('#res');if(re.dataset.v!==h){re.innerHTML=h;re.dataset.v=h}
  $('#day').innerHTML=`<b>${day()}</b>일 · ${SEASONS[season()]}`;
  for(const[k,n]of[['farm','농사'],['build','건축'],['trade','교역']]){$('#sk-'+k).textContent=`${n} ${lv(S.xp[k])}`;$('#skb-'+k).style.width=Math.round(lvp(S.xp[k])*100)+'%'}
  const act=Q.filter(q=>!S.claimed.includes(q.id)).slice(0,4);
  let qh=act.map(q=>{const v=Math.min(q.v(),q.g),done=v>=q.g;return`<li class="${done?'done':''}"><span class="box"></span><span>${q.t} <span class="pg">(${Math.floor(v)}/${q.g})</span></span>${done?`<button class="claim" data-q="${q.id}">보상</button>`:'<span></span>'}</li>`}).join('');
  if(!act.length)qh='<li><span class="box"></span><span>모든 퀘스트를 끝냈어요. 영지를 마음껏 꾸며 보세요</span><span></span></li>';
  const ql=$('#qlist');if(ql.dataset.v!==qh){ql.innerHTML=qh;ql.dataset.v=qh}
  $('#qcnt').textContent=`${S.claimed.length}/${Q.length}`;
  updateSlots();updateConfirm();if(selId)renderSheet();
}

/* ---------- sheet ---------- */
const sheet=$('#sheet');
function openSheet(id){selId=id;armDel=false;renderSheet()}
function closeSheet(){selId=null;sheet.hidden=true;sheet.dataset.v=''}
function renderSheet(){let h='';
  if(selId==='menu'){h=`<div class="top"><h2>작은 영지</h2><button class="iconbtn x" data-act="close" aria-label="닫기">×</button></div>
  <ul class="help"><li>나무와 바위를 탭해서 목재와 석재를 모아요.</li><li>아래 건물을 고르고 빈 땅을 탭한 뒤 짓기를 누르세요.</li><li>건물마다 일손이 필요해요. 오두막을 지으면 주민이 늘어나요.</li><li>겨울에는 밀밭이 쉬어요. 식량을 미리 모으거나 빵집을 지으세요.</li><li>건물을 탭하면 업그레이드할 수 있어요. 시장에서는 자원을 팔 수 있어요.</li></ul>
  <p>진행 상황은 이 기기에 자동으로 저장돼요.</p><div class="acts"><button class="btn warn" data-act="reset">${armReset?'한 번 더 누르면 처음부터 시작':'새로 시작'}</button></div>`}
  else{const b=S.b.find(b=>b.id===selId);if(!b){closeSheet();return}const d=B[b.k],c=upCost(b),p=prodOf(b),need=d.need;
    const img=(b.k==='farm'?THUMB.farm[2]:THUMB[b.k]).toDataURL();
    let stats='';for(const k in (d.prod||{})){const v=p[k]||0;stats+=`<span class="tag">${ic(k)}<span class="num">${v?'+'+v.toFixed(1):'0'}</span>/초</span>`}
    if(d.cap)stats+=`<span class="tag">${ic('pop')}주민 <span class="num">+${d.cap*b.l}</span></span>`;
    if(need)stats+=`<span class="tag ${STAFF[b.id]?'ok':'no'}">일손 <span class="num">${need}</span> · ${STAFF[b.id]?'일하는 중':'일손 부족'}</span>`;
    if(b.k==='farm'&&season()===3)stats+=`<span class="tag no">겨울이라 쉬는 중</span>`;
    const max=b.k==='hall'?3:3;
    h=`<div class="top"><img src="${img}" alt=""><div><h2>${d.n}</h2><div class="lv">LV ${b.l} / ${max}</div></div><button class="iconbtn x" data-act="close" aria-label="닫기">×</button></div><p>${d.d}</p><div class="stat">${stats}</div>
    <div class="acts">${c?`<button class="btn go" data-act="up" ${can(c)?'':'disabled'}>업그레이드 ${Object.entries(c).map(([k,v])=>`${ic(k)}<span class="num">${v}</span>`).join(' ')}</button>`:'<span class="tag ok">최고 레벨</span>'}${b.k!=='hall'?`<button class="btn warn" data-act="del">${armDel?'한 번 더 누르면 철거':'철거'}</button>`:''}</div>`;
    if(b.k==='market'){const g=t=>Math.round(t.g*(1+.1*(lv(S.xp.trade)-1)));h+=`<h3>자원 팔기</h3><div class="trades">${TRADES.map((t,i)=>`<div class="trade">${ic(t.k)} ${RN[t.k]} ${t.n}개 → ${ic('gold')} <b class="num" style="font-family:var(--f-num)">${g(t)}</b><button class="btn" data-act="sell" data-i="${i}" ${S.r[t.k]>=t.n?'':'disabled'}>팔기</button></div>`).join('')}</div>`}
  }
  if(sheet.dataset.v!==h){sheet.innerHTML=h;sheet.dataset.v=h}sheet.hidden=false}
sheet.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;const b=S.b.find(b=>b.id===selId);
  if(act==='close')closeSheet();
  else if(act==='up'&&b)upgrade(b);
  else if(act==='del'&&b){if(armDel)demolish(b);else{armDel=true;renderSheet()}}
  else if(act==='sell')sell(+a.dataset.i);
  else if(act==='reset'){if(armReset){try{localStorage.removeItem(SAVE)}catch(e){}start({fresh:true});closeSheet();toast('새 영지에서 다시 시작해요')}else{armReset=true;renderSheet()}}});

/* ---------- render ---------- */
let last=performance.now(),acc=0,smokeT=0;
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;while(acc>=1){acc-=1;tick()}
  // villagers
  for(const v of vils){if(v.wait>0){v.wait-=dt;v.moving=false;if(v.wait<=0)pickTarget(v);continue}const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);if(d<1){v.wait=1+Math.random()*3;v.moving=false;continue}v.moving=true;v.x+=dx/d*v.sp*dt;v.y+=dy/d*v.sp*dt}
  smokeT+=dt;if(smokeT>.45){smokeT=0;for(const b of S.b)if(B[b.k].smoke&&Math.random()<.7)smoke.push({x:b.x*TS+23+Math.random()*2,y:b.y*TS-7,life:2.4,max:2.4})}
  for(const s of smoke){s.life-=dt;s.y-=6*dt;s.x+=Math.sin(s.life*2)*3*dt+2*dt}smoke=smoke.filter(s=>s.life>0);
  for(const p of parts){p.life-=dt;p.vy+=160*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.life>0);
  draw(now);requestAnimationFrame(frame);
}
function draw(now){
  const k=K();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#2c4f27';ctx.fillRect(0,0,cv.width,cv.height);
  const ox=Math.round(cam.x*k),oy=Math.round(cam.y*k);ctx.setTransform(k,0,0,k,-ox,-oy);ctx.imageSmoothingEnabled=false;
  const vw=cv.width/k,vh=cv.height/k;
  const x0=Math.max(0,Math.floor(cam.x/TS)-1),x1=Math.min(MW-1,Math.ceil((cam.x+vw)/TS)+1),y0=Math.max(0,Math.floor(cam.y/TS)-1),y1=Math.min(MH-1,Math.ceil((cam.y+vh)/TS)+3);
  // map border
  px(-2,-2,MW*TS+4,MH*TS+4,'#24421f');
  const wf=now/110,snow=curSeason===3;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const t=TILES[y*MW+x],X=x*TS,Y=y*TS,h=((x*73856093)^(y*19349663))>>>0;
    if(t===0)ctx.drawImage(SP.grass[h%4],X,Y);
    else if(t===1)ctx.drawImage(SP.path[h%3],X,Y);
    else{ctx.drawImage(SP.water,X,Y);const o=Math.floor(wf+h%16)%16;px(X+2+h%5,Y+o,3,1,snow?'#a9c8e2':'#8fc0ec');px(X+9+(h>>3)%4,Y+(o+8)%16,2,1,snow?'#a9c8e2':'#7ab0e2');
      if(t===3)ctx.drawImage(SP.bridge,X,Y);
      else{const L=T(x-1,y),R=T(x+1,y);if(L>=0&&L<2){px(X,Y,2,16,'#7a5a34');px(X+2,Y,1,16,'#6aa0d6')}if(R>=0&&R<2){px(X+14,Y,2,16,'#7a5a34');px(X+13,Y,1,16,'#6aa0d6')}}}}
  // drawables
  const L=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=S.o[y*MW+x];if(o)L.push({z:y*TS+15,o,x,y})}
  for(const b of S.b){if(b.x*TS>cam.x+vw+32||b.x*TS+32<cam.x-8||b.y*TS>cam.y+vh+40||b.y*TS+32<cam.y-30)continue;L.push({z:b.y*TS+31,b})}
  for(const v of vils)L.push({z:v.y,v});
  L.sort((a,b)=>a.z-b.z);
  for(const d of L){
    if(d.o){const o=d.o,X=d.x*TS,Y=d.y*TS;let sx=0;if(o.sh&&now-o.sh<220)sx=Math.round(Math.sin((now-o.sh)/18)*1.2);
      if(o.k==='rock'){ctx.drawImage(SP.rock,X+sx,Y);if(o.hp<4){px(X+7,Y+7,1,3,'#4a453f');if(o.hp<3)px(X+9,Y+10,2,1,'#4a453f');if(o.hp<2)px(X+5,Y+11,2,1,'#4a453f')}}
      else ctx.drawImage(o.k==='pine'?SP.pine:SP.tree,X+sx,Y-8);}
    else if(d.b){const b=d.b;const img=b.k==='farm'?SP.b.farm[Math.floor(S.time/9+b.id)%3]:SP.b[b.k];const X=b.x*TS,top=b.y*TS+32-img.height;ctx.drawImage(img,X,top);
      for(let i=1;i<b.l;i++){px(X+1+i*4,top+1,3,3,OUT);px(X+2+i*4,top+2,1,1,'#ffe066')}
      if(B[b.k].need&&!STAFF[b.id]){const bx=X+12,by=top-10;px(bx,by,8,9,OUT);px(bx+1,by+1,6,7,'#fff8e6');px(bx+3,by+2,2,3,'#c8452f');px(bx+3,by+6,2,1,'#c8452f')}
      if(selId===b.id&&mode==='hand'){const a=.5+.5*Math.sin(now/200);ctx.globalAlpha=.45+.4*a;px(X,b.y*TS,32,1,'#ffe066');px(X,b.y*TS+31,32,1,'#ffe066');px(X,b.y*TS,1,32,'#ffe066');px(X+31,b.y*TS,1,32,'#ffe066');ctx.globalAlpha=1}}
    else{const v=d.v,x=Math.round(v.x),y=Math.round(v.y),f=v.moving?((now/170|0)%2):0;
      px(x-2,y-1,5,2,'rgba(30,20,10,.25)');px(x-2,y-3,1,f?2:3,'#3b2c22');px(x+1,y-3,1,f?3:2,'#3b2c22');px(x-2,y-7,4,4,v.shirt);px(x-3,y-7,1,3,v.shirt);px(x+2,y-7,1,3,v.shirt);px(x-2,y-11,4,4,'#f0c9a0');px(x-2,y-11,4,1,v.hair);px(x-2,y-10,1,1,v.hair)}
  }
  // ghost
  if(mode!=='hand'&&ghost){const ok=validAt(ghost.x,ghost.y)&&can(B[mode].cost);const img=mode==='farm'?SP.b.farm[2]:SP.b[mode];const X=ghost.x*TS,Y=ghost.y*TS;
    ctx.globalAlpha=.35;px(X,Y,32,32,ok?'#7fe07f':'#ff6a5a');ctx.globalAlpha=.75;ctx.drawImage(img,X,Y+32-img.height);ctx.globalAlpha=1;
    const c=ok?'#d6ffd0':'#ffd0c8';px(X,Y,32,1,c);px(X,Y+31,32,1,c);px(X,Y,1,32,c);px(X+31,Y,1,32,c)}
  for(const s of smoke){ctx.globalAlpha=Math.max(0,s.life/s.max)*.55;const sz=s.life>1.4?2:3;px(Math.round(s.x),Math.round(s.y),sz,sz,'#e9e4dc')}ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2.5);px(Math.round(p.x),Math.round(p.y),1,1,p.col)}ctx.globalAlpha=1;
  // floats in screen space
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  const fs=Math.round(14*dpr);ctx.font=`700 ${fs}px "Pixelify Sans", ui-monospace, monospace`;ctx.textBaseline='middle';ctx.lineJoin='round';
  floats=floats.filter(f=>now-f.born<1100);
  for(const f of floats){const t=(now-f.born)/1100;const sx=f.wx*k-ox,sy=f.wy*k-oy-t*28*dpr;ctx.globalAlpha=t>.7?(1-t)/.3:1;const w=ctx.measureText(f.txt).width;const isz=f.icon?Math.round(14*dpr):0;const tx=sx-(w+isz+(f.icon?4*dpr:0))/2;
    if(f.icon)ctx.drawImage(ICON[f.icon],tx,sy-isz/2,isz,isz);ctx.lineWidth=4*dpr;ctx.strokeStyle='#2a1a0c';ctx.strokeText(f.txt,tx+(f.icon?isz+4*dpr:0),sy);ctx.fillStyle=f.col;ctx.fillText(f.txt,tx+(f.icon?isz+4*dpr:0),sy)}
  ctx.globalAlpha=1;
}

/* ---------- boot ---------- */
let started=false;
function start(data){
  let st=null;
  try{if(data&&data.state)st=load(data.state);else if(!(data&&data.fresh)){const raw=localStorage.getItem(SAVE);if(raw)st=load(raw)}}catch(e){st=null}
  const fresh=!st;S=st||newState();
  TILES=genMap(S.seed).t;PATHS=[];for(let y=0;y<MH;y++)for(let x=riverX(y)+2;x<MW;x++)if(TILES[y*MW+x]===1)PATHS.push([x,y]);
  rebuildOcc();curSeason=-1;onSeason(season(),false);staff();vils=[];syncVils();for(const v of vils){v.x+=Math.random()*20-10;v.wait=Math.random()*2}
  mode='hand';ghost=null;
  if(!started){started=true;resize();addEventListener('resize',resize);buildHotbar();requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
    window.claude?.hot?.snapshot?.(()=>({state:serialize()}));}
  centerOn(15*TS+16,12*TS+20);updateHUD();
  if(fresh)setTimeout(()=>toast('나무를 탭해서 목재를 모아 보세요'),600);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
