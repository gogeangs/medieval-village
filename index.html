<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 영지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Warm parchment HUD. All sprite images are generated by the script below. */
:root{--wood:#73583e;--wood-hi:#a1865d;--wood-lo:#4f4333;--parch:#f1e5c9;--parch-lo:#d5c5a0;--parch-hi:#fff4dc;--ink:#473e30;--ink-soft:#746951;--gold:#c79a50;--go:#677f4d;--go-hi:#91aa6b;--bad:#a65e49;--night:#4e6948;--cream:#fff2d5;--glass:#514a39ed;--f-ui:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-num:'Pixelify Sans',ui-monospace,monospace;color-scheme:light;--dock-height:120px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
img.px{image-rendering:pixelated}
.hud{position:fixed;top:0;left:0;width:min(560px,100%);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:7px;pointer-events:none;z-index:5}
.brand{display:none;margin:0;color:#fff0ca;font-size:23px;font-weight:400;letter-spacing:1px;text-shadow:0 2px #4f5139,1px 0 #5a5b3e,-1px 0 #5a5b3e}
.topbar{display:flex;gap:6px;align-items:stretch;min-width:0}.topbar .res{flex:1 1 auto}.topbar .iconbtn{pointer-events:auto;height:auto;width:44px;min-height:44px}
.row2{display:flex;align-items:flex-start;gap:6px;min-width:0}
.season{margin-left:auto;padding:6px 9px;border-radius:5px;background:var(--glass);color:var(--cream);font-size:12px;white-space:nowrap;flex:none}
.season b{font-family:var(--f-num);font-weight:500;font-size:14px}
.res{pointer-events:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--parch);border:2px solid var(--wood);border-radius:8px;box-shadow:inset 0 1px var(--parch-hi),inset 0 -3px #d3c099,0 3px #394a3633;padding:8px 4px}
.chip{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:5px;row-gap:3px;align-items:center;min-width:0;padding:0 8px;border-right:1px solid #9e885537}
.chip:last-child{border:0}
.chip img{width:20px;height:20px;grid-row:span 2}
.chip .n{font-family:var(--f-num);font-weight:700;font-size:17px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .r{font-family:var(--f-num);font-size:11px;line-height:1.2;color:#777b52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .r.neg{color:var(--bad)}
.status{display:none;align-items:center;gap:6px;min-width:0}
.pill{background:#f1e5c9f2;border:1px solid #806d484f;border-radius:5px;padding:5px 9px;font-size:12px;line-height:1.1;white-space:nowrap;color:var(--ink)}
.skill{flex:1 1 0;min-width:0;display:grid;gap:4px}
.skill .meter{height:3px;background:#82724d24;border-radius:2px;overflow:hidden}
.skill .meter i{display:block;height:100%;background:#bd9759;transition:width .25s}
.skill.farm .meter i{background:#819853}.skill.trade .meter i{background:#77929a}
.iconbtn{appearance:none;border:1px solid var(--wood);background:var(--parch);color:var(--ink);border-radius:6px;box-shadow:inset 0 1px var(--parch-hi),0 2px #4b573444;font-family:var(--f-num);font-weight:500;font-size:20px;width:36px;height:36px;padding:0;cursor:pointer;flex:none}
.iconbtn:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid #d4a14c;outline-offset:3px}
.quests{pointer-events:auto;width:min(240px,72vw);background:var(--parch);border:1px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 0 2px #fff2d358,0 3px #34482c29;overflow:hidden}
.qhead{appearance:none;width:100%;display:flex;align-items:center;gap:7px;background:#e4d3ae;border:0;padding:5px 10px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;min-height:32px}
.qhead .cnt{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-soft)}
.qhead .car{font-size:10px;color:var(--ink-soft);transition:transform .15s}
.quests.closed .car{transform:rotate(-90deg)}
.quests.closed li:not(:first-child){display:none}.quests.closed ul{padding-block:7px}
.quests ul{list-style:none;margin:0;padding:8px 10px 9px;display:grid;gap:8px}
.quests li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;line-height:1.3}
.quests .box{width:8px;height:8px;border:1px solid #a18f66;border-radius:2px;background:#fbf0d3}
.quests li.done .box{background:#809754;border-color:#687d48}
.quests .pg{font-family:var(--f-num);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.claim{appearance:none;border:1px solid #a78343;background:#e7c789;color:var(--ink);border-radius:4px;font-size:12px;padding:4px 8px;cursor:pointer;min-height:30px;box-shadow:0 2px #a7834355}.quests li.done{color:#56693d}
.zoom{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:7px;z-index:5}
.zoom .iconbtn{width:40px;height:40px;font-size:22px}
.build-dock{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:6;display:flex;justify-content:center}
.bar-in{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#bc9a67 transparent;background:var(--wood);border:2px solid var(--wood-lo);border-radius:9px;box-shadow:inset 0 2px var(--wood-hi),0 4px #35432f40;padding:8px 7px 7px;max-width:100%;min-width:0;scroll-padding:8px;overscroll-behavior-x:contain}
.bar-in::-webkit-scrollbar{height:3px}.bar-in::-webkit-scrollbar-thumb{background:#bda173;border-radius:2px}
.slot{appearance:none;flex:0 0 78px;display:grid;justify-items:center;align-content:start;gap:4px;padding:4px 3px 6px;background:var(--parch);border:1px solid #594d38;border-radius:5px;box-shadow:inset 0 -3px #d4c4a1;font-family:var(--f-ui);color:var(--ink);font-size:12px;line-height:1.1;cursor:pointer;position:relative}
.slot .th{width:44px;height:46px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 2px 0 #8d8b6430)}
.slot .th.sq{width:34px;height:36px;margin:5px}
.slot[aria-pressed="true"]{background:#fff0c9;border-color:#e4bc69;box-shadow:inset 0 0 0 2px #e4bc69,inset 0 -3px #dfc894}
.cost{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cost span{display:inline-flex;align-items:center;gap:2px}.cost img{width:10px;height:10px;image-rendering:pixelated}
.slot.poor .cost{color:var(--bad)}.slot.locked .th{filter:grayscale(.8);opacity:.55}.slot.locked .cost{color:var(--ink-soft)}
.confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--dock-height) + 18px);z-index:7;display:flex;align-items:center;gap:8px;background:var(--parch);border:1px solid var(--wood);border-radius:8px;box-shadow:0 4px 12px #34482c33;padding:8px 8px 8px 12px;max-width:calc(100% - 24px);width:max-content}
.confirm .msg{font-size:14px;min-width:0}.confirm .msg small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.35}.confirm .msg small.bad{color:var(--bad)}
.btn{appearance:none;border:1px solid var(--wood-lo);background:var(--wood);color:var(--cream);border-radius:5px;box-shadow:inset 0 1px var(--wood-hi),0 2px #34482c33;font-size:14px;padding:9px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.btn:active:not(:disabled){transform:translateY(1px)}.btn.go{background:var(--go);border-color:#53663e;box-shadow:inset 0 1px var(--go-hi),0 2px #34482c33}.btn.warn{background:#faf0d9;border-color:#b59176;color:#975742;box-shadow:none}.btn:disabled{opacity:.45;cursor:default}.btn img{width:12px;height:12px;image-rendering:pixelated}.btn .num{font-family:var(--f-num);font-size:12px}
.sheet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100% - 24px));max-height:62dvh;overflow:auto;z-index:8;background:var(--parch);border:2px solid var(--wood);border-radius:9px;box-shadow:inset 0 0 0 2px #fff4dc70,0 6px 22px #34482c45;padding:14px 16px 16px;overscroll-behavior:contain}
.sheet .top{display:flex;align-items:center;gap:12px}.sheet .top img{width:56px;height:64px;object-fit:contain;image-rendering:pixelated;flex:none}.sheet h2{margin:0;font-weight:400;font-size:21px}.sheet .lv{font-family:var(--f-num);font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:3px}.sheet .x{margin-left:auto;align-self:start}.sheet p{margin:10px 0 0;font-size:14px;line-height:1.5}.sheet .stat{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;align-items:center;gap:4px;background:#f8eed7;border:1px solid #c5b48e;border-radius:5px;padding:5px 8px;font-size:12px}.tag img{width:12px;height:12px;image-rendering:pixelated}.tag .num{font-family:var(--f-num);font-weight:700}.tag.ok{border-color:#9ba976}.tag.no{border-color:#c7967a;color:var(--bad)}.sheet .acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.sheet .acts .btn{flex-wrap:wrap;white-space:normal}.sheet h3{margin:16px 0 8px;font-weight:400;font-size:15px}.trades{display:grid;gap:6px}.trade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.trade .btn{margin-left:auto}.sheet ul.help{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;top:calc(var(--hud-h,150px) + 10px);transform:translate(-50%,6px);z-index:9;background:var(--glass);color:var(--cream);border:1px solid #d9c69b50;border-radius:7px;padding:9px 14px;font-size:14px;line-height:1.4;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.hud{padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));gap:5px}.season{font-size:11px;padding:5px 7px}.chip{grid-template-columns:16px minmax(0,1fr);padding:0 4px;column-gap:3px}.chip img{width:16px;height:16px}.chip .n{font-size:15px}.chip .r{font-size:10px}.pill{font-size:11px;padding:5px 8px}.quests{width:min(230px,70vw)}.quests ul{gap:7px;padding:8px 9px}.quests li{font-size:11px}.slot{flex-basis:72px}.confirm{flex-wrap:wrap;justify-content:flex-end}.confirm .msg{flex:1 0 100%}.zoom{right:max(10px,env(safe-area-inset-right,0px))}}
@media(max-height:540px) and (orientation:landscape){.hud{width:460px;padding-top:6px;gap:4px}.res{padding:5px 3px}.quests{width:250px}.row2 .season{margin-left:0}.quests ul{max-height:116px;overflow:auto}.slot .th{height:28px;width:34px}.slot .th.sq{height:24px;width:24px;margin:2px 5px}.slot{gap:2px;flex-basis:72px}.bar-in{padding-top:5px;padding-bottom:5px}.build-dock{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}.sheet{max-height:88dvh}.confirm{max-width:400px;left:auto;right:12px;transform:none}}
@media(max-width:520px){.chip:last-child{grid-template-columns:1fr;text-align:center}.chip:last-child img{display:none}}
@media(max-width:360px){.chip{padding:0 2px;grid-template-columns:14px minmax(0,1fr);column-gap:2px}.chip img{width:14px;height:14px}.chip .n{font-size:14px}.chip .r{font-size:9px}}
@media(pointer:coarse){.iconbtn,.zoom .iconbtn{min-width:44px;min-height:44px}.qhead{min-height:38px}.claim{min-height:34px}.btn{min-height:44px}}
@media(min-width:760px) and (min-height:640px){.brand{display:block}.status{display:flex}}
.skillrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}.skillrow .pill{display:grid;gap:5px;font-size:13px}.skillrow .meter{height:4px;background:#82724d24;border-radius:2px;overflow:hidden}.skillrow .meter i{display:block;height:100%}
@media(prefers-reduced-motion:reduce){.toast,.skill .meter i,.qhead .car{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-label="마을 지도"></canvas>

<div class="hud" id="hud">
  <h1 class="brand">작은 영지</h1>
  <div class="topbar"><div class="res" id="res"></div><button class="iconbtn" id="menu" aria-label="메뉴와 스킬">≡</button></div>
  <div class="status">
    <div class="pill skill farm"><span id="sk-farm"></span><div class="meter"><i id="skb-farm"></i></div></div>
    <div class="pill skill build"><span id="sk-build"></span><div class="meter"><i id="skb-build"></i></div></div>
    <div class="pill skill trade"><span id="sk-trade"></span><div class="meter"><i id="skb-trade"></i></div></div>
  </div>
  <div class="row2">
    <section class="quests" id="quests">
      <button class="qhead" id="qhead" aria-expanded="true"><span class="car">▼</span>퀘스트<span class="cnt" id="qcnt"></span></button>
      <ul id="qlist"></ul>
    </section>
    <span class="season" id="day"></span>
  </div>
</div>

<div class="zoom">
  <button class="iconbtn" id="zin" aria-label="확대">+</button>
  <button class="iconbtn" id="zout" aria-label="축소">−</button>
</div>

<div class="confirm" id="confirm" hidden>
  <div class="msg" id="cmsg"></div>
  <button class="btn" id="cno">취소</button>
  <button class="btn go" id="cyes">짓기</button>
</div>

<div class="build-dock"><div class="bar-in" id="hotbar"></div></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const TS=16,MW=28,MH=28,DAY=30,SEASONS=['봄','여름','가을','겨울'];
const SAVE='jageun-yeongji-v1';
const $=s=>document.querySelector(s);
const OUT='#3a2618';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn((x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x,y,w2,h2)},g);return c}
function blob(p,cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)p(cx+x,cy+y,1,1,col)}

/* ---------- definitions ---------- */
const B={
  hall:{n:'마을회관',d:'마을의 중심이에요. 레벨을 올리면 주민이 더 살 수 있고 빵집과 선술집이 열려요.',cap:5,need:0},
  house:{n:'오두막',d:'주민이 사는 집이에요. 레벨마다 3명이 더 살 수 있어요.',cost:{wood:20},cap:3,need:0,hall:1,smoke:1},
  farm:{n:'밀밭',d:'식량을 키워요. 겨울에는 땅이 얼어서 쉬어요.',cost:{wood:15},need:2,prod:{food:1.2},hall:1},
  lumber:{n:'벌목소',d:'일꾼이 나무를 베어 목재를 모아요.',cost:{wood:25,stone:10},need:2,prod:{wood:.8},hall:1},
  quarry:{n:'채석장',d:'언덕에서 돌을 캐 석재를 모아요.',cost:{wood:30},need:2,prod:{stone:.6},hall:1},
  market:{n:'시장',d:'장사로 금화를 벌어요. 남는 자원을 여기서 팔 수 있어요.',cost:{wood:40,stone:20},need:2,prod:{gold:.8},hall:1},
  bakery:{n:'빵집',d:'계절과 상관없이 빵을 구워요. 겨울을 나려면 꼭 필요해요.',cost:{wood:35,stone:30,gold:20},need:2,prod:{food:1.6},hall:2,smoke:1},
  tavern:{n:'선술집',d:'금화를 벌고, 소문이 나서 주민이 더 빨리 모여요.',cost:{wood:60,stone:40,gold:50},need:3,prod:{gold:1.6},hall:2,smoke:1},
};
const ORDER=['house','farm','lumber','quarry','market','bakery','tavern'];
const HALLUP=[null,{wood:80,stone:60,gold:60},{wood:160,stone:140,gold:200}];
const RES=['wood','stone','food','gold'];
const RN={wood:'목재',stone:'석재',food:'식량',gold:'금화'};
const RCOL={wood:'#f0c27a',stone:'#d8d4cc',food:'#ffd27a',gold:'#ffe066'};
const TRADES=[{k:'wood',n:10,g:5},{k:'stone',n:10,g:8},{k:'food',n:10,g:4}];

/* ---------- icons ---------- */
const ICON={
  wood:mk(10,10,p=>{p(1,3,8,5,'#8b5a2b');p(1,3,8,1,'#b07a44');p(1,7,8,1,'#5e3a1c');p(0,3,2,5,'#e2bf86');p(0,5,1,1,'#a87a45');p(4,5,3,1,'#6e4422')}),
  stone:mk(10,10,p=>{blob(p,5,6,3,'#6f6a62');blob(p,4,5,3,'#a9a49b');p(3,3,2,1,'#d5d0c7');p(6,7,2,1,'#7f7a72')}),
  food:mk(10,10,p=>{p(1,4,8,4,'#c07a32');p(2,3,6,1,'#d99a4a');p(1,4,8,2,'#d99a4a');p(3,4,1,1,'#f4cf8a');p(5,4,1,1,'#f4cf8a');p(7,4,1,1,'#f4cf8a');p(1,7,8,1,'#8a4d1c')}),
  gold:mk(10,10,p=>{blob(p,5,5,4,'#a8761c');blob(p,5,5,3,'#e8b93e');p(4,3,2,1,'#fbe08a');p(5,4,1,3,'#c4901f')}),
  pop:mk(10,10,p=>{p(3,1,4,4,'#f0c9a0');p(3,1,4,1,'#6b3f1f');p(2,1,1,2,'#6b3f1f');p(2,5,6,4,'#4f7fb5');p(2,5,6,1,'#6f9fd5');p(3,9,1,1,'#3b2c22');p(6,9,1,1,'#3b2c22')}),
  axe:mk(10,10,p=>{for(let i=0;i<7;i++)p(1+i,8-i,1,1,'#8b5a2b');p(5,1,4,4,'#9aa3ab');p(5,1,4,1,'#d0d6db');p(8,1,1,4,'#6c757d');p(6,3,1,1,'#8b5a2b')}),
};
const IURL={};for(const k in ICON)IURL[k]=ICON[k].toDataURL();
const ic=(k,cls='')=>`<img class="px ${cls}" src="${IURL[k]}" alt="${RN[k]||''}">`;

/* ---------- procedural art: warm countryside, two art pixels per world pixel ---------- */
const ART=2;
const GR=[['#88a966','#789958','#aac77d'],['#7fa061','#6d8e52','#a3bf73'],['#9c9d5c','#87884e','#b7b06e'],['#d8e2df','#c3d1d0','#eef1e6']];
function mix(a,b,t){const A=parseInt(a.slice(1),16),Bc=parseInt(b.slice(1),16),f=s=>[(s>>16)&255,(s>>8)&255,s&255],x=f(A),y=f(Bc);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const LF=[['#719949','#476d3b','#a3bc62'],['#668b43','#3b6137','#96ae55'],['#bb8444','#825732','#e0af61'],['#7e9b83','#516d60','#b6cbb8']];
function art(w,h,fn){return mk(w*ART,h*ART,(p,g)=>fn((x,y,w2,h2,c)=>p(Math.round(x),Math.round(y),Math.round(w2),Math.round(h2),c),g))}
function rectPoly(p,points,c){
  const ys=points.map(v=>v[1]);

/* Static terrain is cached once per season, including a decorative forest ring around the
   playable map so the edge reads as woodland instead of a hard cut. River ripples stay live. */
const M=10;let GROUND=null;
function groundNoise(x,y){return Math.sin(x*.21+y*.13)+Math.sin(y*.27-x*.09+1.7)*.8+Math.sin((x+y)*.47)*.35}
function edgeTile(x,y){if(x>=0&&y>=0&&x<MW&&y<MH)return T(x,y);const rx=riverX(y);if(x===rx||x===rx+1)return 2;if(y===14&&x<0)return 1;return 4}
function rebuildGround(){
  const W=(MW+2*M)*TS,H=(MH+2*M)*TS;
  GROUND=mk(W*ART,H*ART,()=>{});const g=GROUND.getContext('2d');g.imageSmoothingEnabled=false;
  const put=(img,x,y,w=TS,h=TS)=>g.drawImage(img,(x+M*TS)*ART,(y+M*TS)*ART,w*ART,h*ART);
  const p=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect((x+M*TS)*ART,(y+M*TS)*ART,w*ART,h*ART)};
  const se=curSeason,snow=se===3,G=GR[se];
  const ET=edgeTile;
  // 1. grass with soft two-tone patches, laid in 2px cells so it stays crisp
  p(-M*TS,-M*TS,W,H,G[0]);
  // patch layer written straight into pixels at world resolution, then scaled up once
  {const rgb=c=>{const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
   const lite=rgb(mix(G[0],G[2],.45)),dark=rgb(mix(G[0],G[1],.55)),layer=document.createElement('canvas');layer.width=W;layer.height=H;
   const lg=layer.getContext('2d'),img=lg.createImageData(W,H),d=img.data;
   for(let y=0;y<H;y++)for(let x=0;x<W;x++){const cx=x-M*TS,cy=y-M*TS,v=groundNoise(cx/4,cy/4),th=(BAYER[(cy&3)*4+(cx&3)]+.5)/16;
     const c=(v-.85)/.6>th?lite:(-v-.95)/.6>th?dark:null;if(c){const i=(y*W+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}}
   lg.putImageData(img,0,0);g.drawImage(layer,0,0,W*ART,H*ART)}
  // 2. per-tile surface
  for(let y=-M;y<MH+M;y++)for(let x=-M;x<MW+M;x++){
    const t=ET(x,y),X=x*TS,Y=y*TS,h=((x*73856093)^(y*19349663))>>>0,R=rng(h+31);
    if(t===0||t===4){
      for(let i=0;i<2+(h%3);i++){const xx=X+(R()*14|0),yy=Y+2+(R()*13|0);p(xx,yy,.5,1.5,G[1]);p(xx+.5,yy-.5,.5,1.5,G[1]);p(xx+1,yy,.5,1.5,G[2])}
      if(!snow&&h%11===0){const xx=X+3+(R()*9|0),yy=Y+3+(R()*9|0),fc=se===2?'#d9a35a':['#f2e6bf','#e7b6a8','#f0d77c'][h%3];
        for(const[a,b]of[[0,0],[2,1],[1,2.5]]){p(xx+a,yy+b+.5,.5,1,G[1]);p(xx+a-.5,yy+b-.5,1.5,1,fc);p(xx+a,yy+b-.5,.5,.5,'#c99b52')}}
      if(snow&&h%7===0){p(X+(R()*12|0),Y+(R()*12|0),3,.5,'#f6f8f1')}
      if(se===2&&h%3===0)for(let i=0;i<3;i++){const xx=X+(R()*15|0),yy=Y+(R()*15|0);p(xx,yy,1,.5,['#c9763c','#d9a347','#a8552f'][i]);p(xx+.5,yy+.5,.5,.5,'#8f5a2c')}
    }
    if(t===1){put(SP.path[h%SP.path.length],X,Y);
      for(let a=0;a<16;a+=2){const n=1+((h>>(a%12))&1),gr=v=>v===0||v===4;if(gr(ET(x-1,y)))p(X,Y+a,n,2,G[0]);if(gr(ET(x+1,y)))p(X+16-n,Y+a,n,2,G[0]);if(gr(ET(x,y-1)))p(X+a,Y,2,n,G[0]);if(gr(ET(x,y+1)))p(X+a,Y+16-n,2,n,G[0])}
    }else if(t===2||t===3){put(SP.water,X,Y);
      for(const side of[-1,1]){const nt=ET(x+side,y);if(nt===0||nt===1||nt===4){
        for(let a=0;a<16;a++){const n=1+Math.round((Math.sin((Y+a)*.32)+1)*1.2),edge=side<0?X:X+16-n;
          p(edge,Y+a,n,1,snow?'#c5d0c7':'#a9b07e');p(side<0?X+n:X+15-n,Y+a,1,1,snow?'#a4bfbd':'#87b8a7');}
        if(t===2&&h%3===0&&!snow){for(const o of[2,5,8]){p(side<0?X+.5+o%2:X+14.5-o%2,Y+o,.5,4,'#6f8a4c');p(side<0?X+.5+o%2:X+14.5-o%2,Y+o-1,.5,1.5,'#9a7a4f')}}
      }}
      if(t===3)put(SP.bridge,X,Y);
    }
  }
  // 3. forest ring outside the playable map: denser toward the outside, shaded to read as out of bounds
  const trees=[];
  for(let y=-M;y<MH+M;y++)for(let x=-M;x<MW+M;x++){
    if(ET(x,y)!==4)continue;const d=Math.max(-x,-y,x-MW+1,y-MH+1),h=((x*92821)^(y*68917))>>>0;
    if(y>=MH&&y<MH+2)continue; // keep the front edge low so map rows are never covered
    if((h%100)<(d<2?45:d<4?70:88))trees.push({x,y,k:(h>>3)%3===0?'pine':'tree',j:(h>>7)%5-2});
  }
  trees.sort((a,b)=>a.y-b.y||a.x-b.x);
  for(const t of trees){const img=SP[t.k],w=img.width/ART,h=img.height/ART;put(img,t.x*TS+8-w/2+t.j,t.y*TS+16-h+(t.j&1),w,h)}
  for(let x=-M;x<MW+M;x++)for(const y of[MH,MH+1])if(ET(x,y)===4&&((x*31+y)%3)){const X=x*TS,Y=y*TS;oval((a,b,c,d,e)=>p(a/ART,b/ART,c/ART,d/ART,e),(X+8)*ART,(Y+11)*ART,10,6,snow?'#c7d3cf':LF[se][1]);oval((a,b,c,d,e)=>p(a/ART,b/ART,c/ART,d/ART,e),(X+7)*ART,(Y+9)*ART,7,4,snow?'#e5ece6':LF[se][0])}
  g.fillStyle=snow?'rgba(60,80,90,.16)':'rgba(30,50,25,.22)';
  g.fillRect(0,0,M*TS*ART,H*ART);g.fillRect((M+MW)*TS*ART,0,M*TS*ART,H*ART);g.fillRect(M*TS*ART,0,MW*TS*ART,M*TS*ART);g.fillRect(M*TS*ART,(M+MH)*TS*ART,MW*TS*ART,M*TS*ART);
}

/* ---------- map ---------- */
const riverX=y=>7+Math.round(Math.sin(y/3.3)*1.3);
function genMap(seed){
  const R=rng(seed),t=new Uint8Array(MW*MH),o=new Array(MW*MH).fill(null);
  for(let y=0;y<MH;y++){const rx=riverX(y);t[y*MW+rx]=2;t[y*MW+rx+1]=2}
  for(let x=0;x<MW-3;x++){const i=14*MW+x;t[i]=t[i]===2?3:1}
  for(let y=6;y<23;y++){const i=y*MW+19;if(!t[i])t[i]=1}
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;if(t[i])continue;const d=Math.hypot(x-15,y-12);if(d<5)continue;let pr=d>10?.42:d>7?.2:.08;if(x<riverX(y))pr+=.15;const r=R();if(r<pr)o[i]={k:R()<.35?'pine':'tree',hp:3};else if(r<pr+.035)o[i]={k:'rock',hp:4}}
  return{t,o};
}

function tick(){
  const prevSe=season();
  S.time+=1;staff();
  for(const b of S.b){const p=prodOf(b);for(const k in p){S.r[k]+=p[k];if(k==='food')S.xp.farm+=p[k]*.6;if(k==='gold')S.xp.trade+=p[k]*.4}}
  S.r.food-=S.pop*.12;
  if(S.r.food<0){S.r.food=0;S.starveT++;if(S.starveT>=8&&S.pop>1){S.pop--;S.starveT=0;toast('식량이 떨어져 주민 한 명이 마을을 떠났어요')}}else S.starveT=0;
  const c=cap();S.growT++;
  const every=count('tavern')?3:5;
  if(S.pop<c&&S.r.food>=5&&S.growT>=every){S.pop++;S.growT=0;const h=S.b[0];floatTxt(h.x*TS+16,h.y*TS+4,'+1','#cfe8ff','pop')}
  if(S.pop>c)S.pop=c;
  S.spawnT++;
  if(S.spawnT>=20){S.spawnT=0;const n=S.o.filter(Boolean).length;if(n<150){for(let tries=0;tries<20;tries++){const x=Math.random()*MW|0,y=Math.random()*MH|0,i=y*MW+x;if(TILES[i]||S.o[i]||OCC[i])continue;if(Math.hypot(x-15,y-12)<4)continue;S.o[i]=Math.random()<.85?{k:Math.random()<.35?'pine':'tree',hp:3}:{k:'rock',hp:4};break}}}
  const se=season();if(se!==prevSe)onSeason(se,true);
  syncVils();updateHUD();
  if(S.time%5===0)save();
}

function hitAt(wx,wy){
  const candidates=[];
  for(const b of S.b){const img=b.k==='farm'?SP.b.farm[Math.floor(S.time/9+b.id)%3]:SP.b[b.k];candidates.push({z:b.y*TS+31,img,x:b.x*TS,y:b.y*TS+32-img.height/ART,id:b.id})}
  for(let y=Math.max(0,Math.floor(wy/TS)-1);y<Math.min(MH,Math.floor(wy/TS)+4);y++)for(let x=Math.max(0,Math.floor(wx/TS)-1);x<Math.min(MW,Math.floor(wx/TS)+2);x++){
    const o=S.o[y*MW+x];if(!o)continue;const img=SP[o.k],w=img.width/ART,h=img.height/ART;
    candidates.push({z:y*TS+15,img,x:x*TS+(TS-w)/2,y:y*TS+TS-h,tx:x,ty:y});
  }
  candidates.sort((a,b)=>b.z-a.z);
  for(const c of candidates){const x=Math.floor((wx-c.x)*ART),y=Math.floor((wy-c.y)*ART);if(x<0||y<0||x>=c.img.width||y>=c.img.height)continue;
    if(!c.img.hitAlpha)c.img.hitAlpha=c.img.getContext('2d').getImageData(0,0,c.img.width,c.img.height).data;
    if(c.img.hitAlpha[(y*c.img.width+x)*4+3]>128)return c;
  }
  return null;
}

      px(x0-.5,cy-(sy>0?.5:1),L+1,1.5,'#4b3a28');px(cx-(sx>0?.5:1),y0-.5,1.5,L+1,'#4b3a28');px(x0,cy-(sy>0?0:.5),L,.5,'#ffe9a6');px(cx-(sx>0?0:.5),y0,.5,L,'#ffe9a6')}}}
  // ghost
  if(mode!=='hand'&&ghost){const ok=validAt(ghost.x,ghost.y)&&can(B[mode].cost);const img=mode==='farm'?SP.b.farm[2]:SP.b[mode];const X=ghost.x*TS,Y=ghost.y*TS;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){const tx=ghost.x+dx,ty=ghost.y+dy,i=ty*MW+tx,inside=tx>=0&&ty>=0&&tx<MW&&ty<MH,good=inside&&TILES[i]<=1&&!S.o[i]&&!OCC[i],cx=X+dx*16,cy=Y+dy*16;
      ctx.globalAlpha=good?.28:.5;px(cx+.5,cy+.5,15,15,good?'#9fe28a':'#e2604c');ctx.globalAlpha=1;
      if(!good){px(cx+5,cy+5,1,1,'#fff1e8');px(cx+6,cy+6,4,4,'#fff1e8');px(cx+10,cy+10,1,1,'#fff1e8');px(cx+10,cy+5,1,1,'#fff1e8');px(cx+5,cy+10,1,1,'#fff1e8')}}
    if(mode!=='farm'){ctx.globalAlpha=.7;ctx.drawImage(SP.yard[mode],X-4,Y+24,40,14)}
    ctx.globalAlpha=ok?.85:.55;ctx.drawImage(img,X,Y+32-img.height/ART,img.width/ART,img.height/ART);ctx.globalAlpha=1;
    const c=ok?'#e6ffd9':'#ffd6cc',d='#3c3020';for(const[a,b2,w,h]of[[X,Y,32,1],[X,Y+31,32,1],[X,Y,1,32],[X+31,Y,1,32]]){px(a-.5,b2-.5,w+1,h+1,d);px(a,b2,w,h,c)}}
  for(const s of smoke){ctx.globalAlpha=Math.max(0,s.life/s.max)*.55;const sz=s.life>1.4?2:3;px(Math.round(s.x),Math.round(s.y),sz,sz,'#e9e4dc')}ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life*2.5);px(Math.round(p.x),Math.round(p.y),1,1,p.col)}ctx.globalAlpha=1;
  // floats in screen space
  ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  const fs=Math.round(14*dpr);ctx.font=`700 ${fs}px "Pixelify Sans", ui-monospace, monospace`;ctx.textBaseline='middle';ctx.lineJoin='round';
  floats=floats.filter(f=>now-f.born<1100);
  for(const f of floats){const t=(now-f.born)/1100;const sx=f.wx*k-ox,sy=f.wy*k-oy-t*28*dpr;ctx.globalAlpha=t>.7?(1-t)/.3:1;const w=ctx.measureText(f.txt).width;const isz=f.icon?Math.round(14*dpr):0;const tx=sx-(w+isz+(f.icon?4*dpr:0))/2;
    if(f.icon)ctx.drawImage(ICON[f.icon],tx,sy-isz/2,isz,isz);ctx.lineWidth=4*dpr;ctx.strokeStyle='#2a1a0c';ctx.strokeText(f.txt,tx+(f.icon?isz+4*dpr:0),sy);ctx.fillStyle=f.col;ctx.fillText(f.txt,tx+(f.icon?isz+4*dpr:0),sy)}
  ctx.globalAlpha=1;
}

/* ---------- boot ---------- */
let started=false;
function start(data){
  let st=null;
  try{if(data&&data.state)st=load(data.state);else if(!(data&&data.fresh)){const raw=localStorage.getItem(SAVE);if(raw)st=load(raw)}}catch(e){st=null}
  const fresh=!st;S=st||newState();
  TILES=genMap(S.seed).t;PATHS=[];for(let y=0;y<MH;y++)for(let x=riverX(y)+2;x<MW;x++)if(TILES[y*MW+x]===1)PATHS.push([x,y]);
  rebuildOcc();curSeason=-1;onSeason(season(),false);staff();vils=[];syncVils();for(const v of vils){v.x+=Math.random()*20-10;v.wait=Math.random()*2}
  mode='hand';ghost=null;
  if(!started){started=true;resize();addEventListener('resize',resize);buildHotbar();measureHud();if(typeof ResizeObserver!=='undefined')new ResizeObserver(measureHud).observe($('#hud'));requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
    window.claude?.hot?.snapshot?.(()=>({state:serialize()}));}
  updateHUD();measureHud();centerOn(15*TS+16,12*TS+10);
  if(fresh)setTimeout(()=>toast('나무를 탭해서 목재를 모아 보세요'),600);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
