<style>
/* Illustrated countryside HUD. Game rules stay here; painted assets use relative URLs. */
:root{--wood:#73583e;--wood-hi:#a1865d;--wood-lo:#4f4333;--parch:#f1e5c9;--parch-lo:#d5c5a0;--parch-hi:#fff4dc;--ink:#473e30;--ink-soft:#746951;--gold:#c79a50;--go:#677f4d;--go-hi:#91aa6b;--bad:#a65e49;--night:#4e6948;--cream:#fff2d5;--glass:#514a39ed;--f-ui:'Jua',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-num:'Jua',system-ui,sans-serif;color-scheme:light;--dock-height:120px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

.hud{position:fixed;top:0;left:0;width:min(560px,100%);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:7px;pointer-events:none;z-index:5}
.brand{display:none;margin:0;color:#fff0ca;font-size:23px;font-weight:400;letter-spacing:1px;text-shadow:0 2px #4f5139,1px 0 #5a5b3e,-1px 0 #5a5b3e}
.topbar{display:flex;gap:6px;align-items:stretch;min-width:0}.topbar .res{flex:1 1 auto}.topbar .iconbtn{pointer-events:auto;height:auto;width:44px;min-height:44px}
.row2{display:flex;align-items:flex-start;gap:6px;min-width:0}
.season{margin-left:auto;padding:6px 9px;border-radius:5px;background:var(--glass);color:var(--cream);font-size:12px;white-space:nowrap;flex:none}
.season b{font-family:var(--f-num);font-weight:500;font-size:14px}

.skill.farm .meter i{background:#819853}.skill.trade .meter i{background:#77929a}
.iconbtn{appearance:none;border:1px solid var(--wood);background:var(--parch);color:var(--ink);border-radius:6px;box-shadow:inset 0 1px var(--parch-hi),0 2px #4b573444;font-family:var(--f-num);font-weight:500;font-size:20px;width:36px;height:36px;padding:0;cursor:pointer;flex:none}
.iconbtn:active{transform:translateY(1px)}

.quests{pointer-events:auto;width:min(240px,72vw);background:var(--parch);border:1px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 0 2px #fff2d358,0 3px #34482c29;overflow:hidden}
.qhead{appearance:none;width:100%;display:flex;align-items:center;gap:7px;background:#e4d3ae;border:0;padding:5px 10px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;min-height:32px}
.qhead .cnt{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-soft)}
.qhead .car{font-size:10px;color:var(--ink-soft);transition:transform .15s}
.quests.closed .car{transform:rotate(-90deg)}
.quests.closed li:not(:first-child){display:none}.quests.closed ul{padding-block:7px}
.quests ul{list-style:none;margin:0;padding:8px 10px 9px;display:grid;gap:8px}
.quests li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;line-height:1.3}
.quests .box{width:8px;height:8px;border:1px solid #a18f66;border-radius:2px;background:#fbf0d3}
.quests li.done .box{background:#809754;border-color:#687d48}
.quests .pg{font-family:var(--f-num);font-size:11px;color:var(--ink-soft);white-space:nowrap}

.zoom .iconbtn{width:40px;height:40px;font-size:22px}
.build-dock{position:fixed;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));pointer-events:none;z-index:6;display:flex;justify-content:center}
.bar-in{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#bc9a67 transparent;background:var(--wood);border:2px solid var(--wood-lo);border-radius:9px;box-shadow:inset 0 2px var(--wood-hi),0 4px #35432f40;padding:8px 7px 7px;max-width:100%;min-width:0;scroll-padding:8px;overscroll-behavior-x:contain}
.bar-in::-webkit-scrollbar{height:3px}.bar-in::-webkit-scrollbar-thumb{background:#bda173;border-radius:2px}
.slot{appearance:none;flex:0 0 78px;display:grid;justify-items:center;align-content:start;gap:4px;padding:4px 3px 6px;background:var(--parch);border:1px solid #594d38;border-radius:5px;box-shadow:inset 0 -3px #d4c4a1;font-family:var(--f-ui);color:var(--ink);font-size:12px;line-height:1.1;cursor:pointer;position:relative}
.slot .th{width:44px;height:46px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 2px 0 #8d8b6430)}
.slot .th.sq{width:34px;height:36px;margin:5px}
.slot[aria-pressed="true"]{background:#fff0c9;border-color:#e4bc69;box-shadow:inset 0 0 0 2px #e4bc69,inset 0 -3px #dfc894}
.cost{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;font-family:var(--f-num);font-weight:500;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cost span{display:inline-flex;align-items:center;gap:2px}.cost img{width:10px;height:10px;image-rendering:auto}
.slot.poor .cost{color:var(--bad)}.slot.locked .th{filter:grayscale(.8);opacity:.55}.slot.locked .cost{color:var(--ink-soft)}
.confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--dock-height) + 18px);z-index:7;display:flex;align-items:center;gap:8px;background:var(--parch);border:1px solid var(--wood);border-radius:8px;box-shadow:0 4px 12px #34482c33;padding:8px 8px 8px 12px;max-width:calc(100% - 24px);width:max-content}
.confirm .msg{font-size:14px;min-width:0}.confirm .msg small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.35}.confirm .msg small.bad{color:var(--bad)}
.btn{appearance:none;border:1px solid var(--wood-lo);background:var(--wood);color:var(--cream);border-radius:5px;box-shadow:inset 0 1px var(--wood-hi),0 2px #34482c33;font-size:14px;padding:9px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px}
.btn:active:not(:disabled){transform:translateY(1px)}.btn.go{background:var(--go);border-color:#53663e;box-shadow:inset 0 1px var(--go-hi),0 2px #34482c33}.btn.warn{background:#faf0d9;border-color:#b59176;color:#975742;box-shadow:none}.btn:disabled{opacity:.45;cursor:default}.btn img{width:12px;height:12px;image-rendering:auto}.btn .num{font-family:var(--f-num);font-size:12px}
.sheet{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100% - 24px));max-height:62dvh;overflow:auto;z-index:8;background:var(--parch);border:2px solid var(--wood);border-radius:9px;box-shadow:inset 0 0 0 2px #fff4dc70,0 6px 22px #34482c45;padding:14px 16px 16px;overscroll-behavior:contain}
.sheet .top{display:flex;align-items:center;gap:12px}.sheet .top img{width:56px;height:64px;object-fit:contain;image-rendering:auto;flex:none}.sheet h2{margin:0;font-weight:400;font-size:21px}.sheet .lv{font-family:var(--f-num);font-size:12px;color:var(--ink-soft);letter-spacing:1px;margin-top:3px}.sheet .x{margin-left:auto;align-self:start}.sheet p{margin:10px 0 0;font-size:14px;line-height:1.5}.sheet .stat{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}.tag{display:inline-flex;align-items:center;gap:4px;background:#f8eed7;border:1px solid #c5b48e;border-radius:5px;padding:5px 8px;font-size:12px}.tag img{width:12px;height:12px;image-rendering:auto}.tag .num{font-family:var(--f-num);font-weight:700}.tag.ok{border-color:#9ba976}.tag.no{border-color:#c7967a;color:var(--bad)}.sheet .acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.sheet .acts .btn{flex-wrap:wrap;white-space:normal}.sheet h3{margin:16px 0 8px;font-weight:400;font-size:15px}.trades{display:grid;gap:6px}.trade{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}.trade .btn{margin-left:auto}.sheet ul.help{margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;top:calc(var(--hud-h,150px) + 10px);transform:translate(-50%,6px);z-index:9;background:var(--glass);color:var(--cream);border:1px solid #d9c69b50;border-radius:7px;padding:9px 14px;font-size:14px;line-height:1.4;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.hud{padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));gap:5px}.season{font-size:11px;padding:5px 7px}.chip{grid-template-columns:16px minmax(0,1fr);padding:0 4px;column-gap:3px}.chip img{width:16px;height:16px}.chip .n{font-size:15px}.chip .r{font-size:10px}.pill{font-size:11px;padding:5px 8px}.quests{width:min(230px,70vw)}.quests ul{gap:7px;padding:8px 9px}.quests li{font-size:11px}.slot{flex-basis:72px}.confirm{flex-wrap:wrap;justify-content:flex-end}.confirm .msg{flex:1 0 100%}.zoom{right:max(10px,env(safe-area-inset-right,0px))}}
@media(max-height:540px) and (orientation:landscape){.hud{width:460px;padding-top:6px;gap:4px}.res{padding:5px 3px}.quests{width:250px}.row2 .season{margin-left:0}.quests ul{max-height:116px;overflow:auto}.slot .th{height:28px;width:34px}.slot .th.sq{height:24px;width:24px;margin:2px 5px}.slot{gap:2px;flex-basis:72px}.bar-in{padding-top:5px;padding-bottom:5px}.build-dock{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}.sheet{max-height:88dvh}.confirm{max-width:400px;left:auto;right:12px;transform:none}}
@media(max-width:520px){.chip:last-child{grid-template-columns:1fr;text-align:center}.chip:last-child img{display:none}}
@media(max-width:360px){.chip{padding:0 2px;grid-template-columns:14px minmax(0,1fr);column-gap:2px}.chip img{width:14px;height:14px}.chip .n{font-size:14px}.chip .r{font-size:9px}}
@media(pointer:coarse){.iconbtn,.zoom .iconbtn{min-width:44px;min-height:44px}.qhead{min-height:38px}.claim{min-height:34px}.btn{min-height:44px}}
@media(min-width:760px) and (min-height:640px){.brand{display:block}.status{display:flex}}
.skillrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:12px}.skillrow .pill{display:grid;gap:5px;font-size:13px}.skillrow .meter{height:4px;background:#82724d24;border-radius:2px;overflow:hidden}.skillrow .meter i{display:block;height:100%}
@media(prefers-reduced-motion:reduce){.toast,.skill .meter i,.qhead .car{transition:none}}

.tag,.claim{border-radius:5px}.claim{background:#7b9357}.toast{background:#425a40f2;color:#fff0c8;border:1px solid #bdad79;border-radius:8px;box-shadow:0 5px 15px #263e323d}

<script>
(()=>{
const TS=16,MW=28,MH=28,DAY=30,SEASONS=['봄','여름','가을','겨울'];
const SAVE='jageun-yeongji-v1';

function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn((x,y,w2,h2,col)=>{g.fillStyle=col;g.fillRect(x,y,w2,h2)},g);return c}

/* ---------- definitions ---------- */
const B={
  hall:{n:'마을회관',d:'마을의 중심이에요. 레벨을 올리면 주민이 더 살 수 있고 빵집과 선술집이 열려요.',cap:5,need:0},
  house:{n:'오두막',d:'주민이 사는 집이에요. 레벨마다 3명이 더 살 수 있어요.',cost:{wood:20},cap:3,need:0,hall:1,smoke:1},

  if(S.r.food<0){S.r.food=0;S.starveT++;if(S.starveT>=8&&S.pop>1){S.pop--;S.starveT=0;toast('식량이 떨어져 주민 한 명이 마을을 떠났어요')}}else S.starveT=0;
  const c=cap();S.growT++;
  const every=count('tavern')?3:5;
  if(S.pop<c&&S.r.food>=5&&S.growT>=every){S.pop++;S.growT=0;const h=S.b[0];floatTxt(h.x*TS+16,h.y*TS+4,'+1','#cfe8ff','pop')}
  if(S.pop>c)S.pop=c;
  S.spawnT++;
  if(S.spawnT>=20){S.spawnT=0;const n=S.o.filter(Boolean).length;if(n<150){for(let tries=0;tries<20;tries++){const x=Math.random()*MW|0,y=Math.random()*MH|0,i=y*MW+x;if(TILES[i]||S.o[i]||OCC[i])continue;if(Math.hypot(x-15,y-12)<4)continue;S.o[i]=Math.random()<.85?{k:Math.random()<.35?'pine':'tree',hp:3}:{k:'rock',hp:4};break}}}
  const se=season();if(se!==prevSe)onSeason(se,true);
  syncVils();updateHUD();
  if(S.time%5===0)save();
}
function onSeason(se,announce){if(se===curSeason)return;curSeason=se;SP=buildSprites(se);rebuildGround();if(announce)toast(['봄이 왔어요. 밀밭이 다시 자라요','여름이에요. 밀이 쑥쑥 자라요','가을이에요. 밀밭이 황금빛으로 물들어요','겨울이에요. 밀밭이 쉬어요. 빵집이 있으면 든든해요'][se])}

/* ---------- actions ---------- */
let mode='hand',ghost=null,movingId=null,selId=null,armDel=false,armReset=false;
const movingBuilding=()=>mode==='move'?S.b.find(b=>b.id===movingId):null;
function placeableCell(x,y,ignoreId=0){if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=MW||y>=MH)return false;const i=y*MW+x;return TILES[i]<=1&&!S.o[i]&&(!OCC[i]||OCC[i]===ignoreId)}
function validAt(x,y,ignoreId=0){for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)if(!placeableCell(x+dx,y+dy,ignoreId))return false;return true}
function finishPlacement(){mode='hand';movingId=null;ghost=null;closeSheet();updateConfirm();updateSlots()}
function beginMove(b){if(!b||!S.b.includes(b))return;mode='move';movingId=b.id;ghost=null;armDel=false;closeSheet();updateSlots();updateConfirm();toast('옮길 곳을 탭한 뒤 이동을 눌러 주세요')}
function moveBuilding(){const b=movingBuilding();if(!b||!ghost||!validAt(ghost.x,ghost.y,b.id)||(b.x===ghost.x&&b.y===ghost.y))return;b.x=ghost.x;b.y=ghost.y;rebuildOcc();finishPlacement();toast(`${B[b.k].n}을(를) 옮겼어요`);updateHUD();save()}
function build(){if(!ghost||mode==='move'||!B[mode])return;const k=mode,d=B[k];if(!validAt(ghost.x,ghost.y)||!can(d.cost)||hallL()<d.hall)return;pay(d.cost);const b={id:S.nid++,k,x:ghost.x,y:ghost.y,l:1};S.b.push(b);rebuildOcc();S.xp.build+=25;staff();chips(b.x*TS+16,b.y*TS+28,'#d8c49a',10);floatTxt(b.x*TS+16,b.y*TS,d.n,'#fff3d4');toast(`${d.n}을(를) 지었어요`);finishPlacement();updateHUD();save()}
function harvest(x,y){const i=y*MW+x,o=S.o[i];if(!o)return false;const now=performance.now();o.sh=now;o.hp--;const wx=x*TS+8,wy=y*TS+4;
  if(o.k==='rock'){S.r.stone+=2;S.st.stone+=2;floatTxt(wx,wy,'+2',RCOL.stone,'stone');chips(wx,wy+6,'#a9a49b')}
  else{S.r.wood+=2;S.st.wood+=2;floatTxt(wx,wy-6,'+2',RCOL.wood,'wood');chips(wx,wy+2,LF[curSeason][0])}
  if(o.hp<=0){S.o[i]=null;if(o.k==='rock'){S.r.stone+=2;S.st.stone+=2}else{S.r.wood+=2;S.st.wood+=2}chips(wx,wy+6,o.k==='rock'?'#8f897e':'#8b5a2b',8)}
  updateHUD();return true}

function upgrade(b){const c=upCost(b);if(!c||!can(c))return;pay(c);b.l++;S.xp.build+=40;staff();chips(b.x*TS+16,b.y*TS+20,'#e8b93e',10);toast(`${B[b.k].n} ${b.l}레벨이 되었어요`);updateHUD();save()}
function demolish(b){if(b.k==='hall')return;const c=B[b.k].cost;for(const k in c)S.r[k]+=Math.floor(c[k]/2);S.b=S.b.filter(x=>x!==b);rebuildOcc();staff();toast(`${B[b.k].n}을(를) 허물고 자재 절반을 돌려받았어요`);closeSheet();updateHUD();save()}
function sell(i){const t=TRADES[i];if(S.r[t.k]<t.n)return;const g=Math.round(t.g*(1+.1*(lv(S.xp.trade)-1)));S.r[t.k]-=t.n;S.r.gold+=g;S.st.sold+=t.n;S.xp.trade+=g;const m=S.b.find(b=>b.k==='market');if(m)floatTxt(m.x*TS+16,m.y*TS,'+'+g,RCOL.gold,'gold');updateHUD()}
function claim(id){const q=Q.find(q=>q.id===id);if(!q||S.claimed.includes(id)||q.v()<q.g)return;S.claimed.push(id);give(q.r);const h=S.b[0];chips(h.x*TS+16,h.y*TS,'#e8b93e',12);toast(`퀘스트 완료: ${q.t}`);updateHUD();save()}

/* ---------- input ---------- */
const pointers=new Map();
let ptr=null,pinch=null;
// Rebase from the current camera whenever the active fingers change.
// A gesture that used two fingers stays a drag until all fingers are lifted.
function rebaseGesture(suppressTap=true){
  ptr=null;pinch=null;
  const active=[...pointers.entries()];
  if(active.length>=2){
    const [[id,a],[other,b]]=active,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={id,other,distance:Math.hypot(b.x-a.x,b.y-a.y),zoom,
      world:{x:cam.x+m.x/css(),y:cam.y+m.y/css()}};
  }else if(active.length){
    const [id,p]=active[0];ptr={id,x:p.x,y:p.y,cx:cam.x,cy:cam.y,drag:suppressTap};
  }
}
function resetGesture(){
  const ids=[...pointers.keys()];pointers.clear();ptr=null;pinch=null;
  for(const id of ids)if(cv.hasPointerCapture?.(id))cv.releasePointerCapture(id);
}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  rebaseGesture(pointers.size>1);
});
cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){
    if(e.pointerId!==pinch.id&&e.pointerId!==pinch.other)return;
    const a=pointers.get(pinch.id),b=pointers.get(pinch.other),distance=Math.hypot(b.x-a.x,b.y-a.y);
    if(pinch.distance<2){rebaseGesture();return}
    setZoomAt(pinch.zoom*distance/pinch.distance,{x:(a.x+b.x)/2,y:(a.y+b.y)/2},pinch.world);
  }else if(ptr&&e.pointerId===ptr.id){
    const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
    if(!ptr.drag&&Math.hypot(dx,dy)>8)ptr.drag=true;
    if(ptr.drag){cam.x=ptr.cx-dx/css();cam.y=ptr.cy-dy/css();clampCam()}
  }
});
const endPtr=e=>{
  if(!pointers.has(e.pointerId))return;
  const isTap=pointers.size===1&&ptr?.id===e.pointerId&&!ptr.drag&&e.type==='pointerup';
  pointers.delete(e.pointerId);
  if(cv.hasPointerCapture?.(e.pointerId))cv.releasePointerCapture(e.pointerId);
  rebaseGesture();
  if(isTap)tap(e.clientX,e.clientY);
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('lostpointercapture',endPtr);
addEventListener('blur',resetGesture);
cv.addEventListener('wheel',e=>{e.preventDefault();if(!pinch&&e.deltaY)setZoom(e.deltaY<0?1:-1)},{passive:false});

function hitAt(wx,wy){
  const candidates=[];
  for(const b of S.b){const img=b.k==='farm'?SP.b.farm[Math.floor(S.time/9+b.id)%3]:SP.b[b.k];candidates.push({z:b.y*TS+31,img,x:b.x*TS,y:b.y*TS+32-img.height/ART,id:b.id})}
  for(let y=Math.max(0,Math.floor(wy/TS)-1);y<Math.min(MH,Math.floor(wy/TS)+4);y++)for(let x=Math.max(0,Math.floor(wx/TS)-1);x<Math.min(MW,Math.floor(wx/TS)+2);x++){
    const o=S.o[y*MW+x];if(!o)continue;const img=SP[o.k],w=img.width/ART,h=img.height/ART;
    candidates.push({z:y*TS+15,img,x:x*TS+(TS-w)/2,y:y*TS+TS-h,tx:x,ty:y});
  }
  candidates.sort((a,b)=>b.z-a.z);
  for(const c of candidates){const x=Math.floor((wx-c.x)*ART),y=Math.floor((wy-c.y)*ART);if(x<0||y<0||x>=c.img.width||y>=c.img.height)continue;
    if(!c.img.hitAlpha)c.img.hitAlpha=c.img.getContext('2d').getImageData(0,0,c.img.width,c.img.height).data;
    if(c.img.hitAlpha[(y*c.img.width+x)*4+3]>128)return c;
  }
  return null;
}
function tap(cx,cy){const wx=cam.x+cx/css(),wy=cam.y+cy/css(),tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);
  if(mode==='hand'){const hit=hitAt(wx,wy);if(hit){if(hit.id)openSheet(hit.id);else harvest(hit.tx,hit.ty);return}const id=T(tx,ty)>=0?OCC[ty*MW+tx]:0;if(id){openSheet(id);return}if(T(tx,ty)>=0&&harvest(tx,ty))return;closeSheet();return}
  ghost={x:Math.round(wx/TS-1),y:Math.round(wy/TS-1)};updateConfirm()}
$('#zin').onclick=()=>setZoom(1);$('#zout').onclick=()=>setZoom(-1);
function setQuestOpen(open){const q=$('#quests');q.classList.toggle('closed',!open);$('#qhead').setAttribute('aria-expanded',open);try{localStorage.setItem(SAVE+'-ui',open?'open':'closed')}catch(e){};requestAnimationFrame(measureHud)}
$('#qhead').onclick=()=>setQuestOpen($('#quests').classList.contains('closed'));
{let pref=null;try{pref=localStorage.getItem(SAVE+'-ui')}catch(e){}const open=pref?pref==='open':!(innerWidth<=520||innerHeight<=540);$('#quests').classList.toggle('closed',!open);$('#qhead').setAttribute('aria-expanded',open)}

/* ---------- hotbar ---------- */
function costHTML(c){return Object.entries(c||{}).map(([k,v])=>`<span>${ic(k)}${v}</span>`).join('')}
function buildHotbar(){const h=$('#hotbar');let html=`<button class="slot" data-m="hand" aria-pressed="true"><img class="th sq" src="${IURL.axe}" alt=""><span>채집</span><span class="cost">탭해서 수확</span></button>`;
  for(const k of ORDER)html+=`<button class="slot" data-m="${k}" aria-pressed="false"><img class="th" src="${THUMBURL[k]}" alt=""><span>${B[k].n}</span><span class="cost" data-cost>${costHTML(B[k].cost)}</span></button>`;
  h.innerHTML=html;measureDock();if(typeof ResizeObserver!=='undefined')new ResizeObserver(measureDock).observe(h);h.addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s)return;const m=s.dataset.m;if(m!=='hand'&&hallL()<B[m].hall){toast(`마을회관 ${B[m].hall}레벨이 되면 지을 수 있어요`);return}mode=(mode===m&&m!=='hand')?'hand':m;movingId=null;ghost=null;closeSheet();updateConfirm();updateSlots();if(mode!=='hand')toast('지을 곳을 탭하세요')})}
function updateSlots(){document.querySelectorAll('.slot').forEach(s=>{const m=s.dataset.m;s.setAttribute('aria-pressed',m===mode);if(m==='hand')return;const locked=hallL()<B[m].hall;s.classList.toggle('locked',locked);s.classList.toggle('poor',!locked&&!can(B[m].cost));const ce=s.querySelector('[data-cost]');const want=locked?`회관 Lv${B[m].hall}`:costHTML(B[m].cost);if(ce.dataset.v!==want){ce.innerHTML=want;ce.dataset.v=want}})}
function updateConfirm(){
  const c=$('#confirm'),yes=$('#cyes'),b=movingBuilding();
  yes.textContent=mode==='move'?'이동':'짓기';
  if(mode==='move'){
    if(!b){c.hidden=true;return}
    c.hidden=false;
    const ok=ghost&&validAt(ghost.x,ghost.y,b.id),same=ghost&&ghost.x===b.x&&ghost.y===b.y;
    const msg=!ghost?'옮길 곳을 탭하세요 · 이동 비용 없음':!ok?'여기엔 옮길 수 없어요. 빈 땅을 탭하세요':same?'현재 위치예요. 다른 곳을 탭하세요':'이 위치로 옮겨요 · 이동 비용 없음';
    $('#cmsg').innerHTML=`${B[b.k].n} 옮기기<small class="${ghost&&(!ok||same)?'bad':''}">${msg}</small>`;yes.disabled=!ok||same;return;
  }
  if(mode==='hand'||!ghost){c.hidden=true;return}
  const d=B[mode],ok=validAt(ghost.x,ghost.y),af=can(d.cost),unlocked=hallL()>=d.hall;c.hidden=false;
  $('#cmsg').innerHTML=`${d.n} 짓기<small class="${ok&&af&&unlocked?'':'bad'}">${!ok?'여기엔 지을 수 없어요. 나무와 바위를 치우거나 다른 곳을 탭하세요':!unlocked?`마을회관 ${d.hall}레벨이 필요해요`:!af?'자원이 부족해요':'2×2칸을 차지해요'}</small>`;yes.disabled=!(ok&&af&&unlocked)
}

function fmtRate(v){if(Math.abs(v)<.05)return'\u00a0';return(v>0?'+':'')+v.toFixed(1)}
function updateHUD(){

  if(!act.length)qh='<li><span class="box"></span><span>모든 퀘스트를 끝냈어요. 영지를 마음껏 꾸며 보세요</span><span></span></li>';

    <div class="acts">${c?`<button class="btn go" data-act="up" ${can(c)?'':'disabled'}>업그레이드 ${Object.entries(c).map(([k,v])=>`${ic(k)}<span class="num">${v}</span>`).join(' ')}</button>`:'<span class="tag ok">최고 레벨</span>'}<button class="btn" data-act="move">옮기기</button>${b.k!=='hall'?`<button class="btn warn" data-act="del">${armDel?'한 번 더 누르면 철거':'철거'}</button>`:''}</div>`;

/* ---------- render ---------- */
let last=performance.now(),acc=0,smokeT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;acc+=dt;while(acc>=1){acc-=1;tick()}
  // villagers
  for(const v of vils){if(v.wait>0){v.wait-=dt;v.moving=false;if(v.wait<=0)pickTarget(v);continue}const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy);if(d<1){v.wait=1+Math.random()*3;v.moving=false;continue}v.moving=true;v.x+=dx/d*v.sp*dt;v.y+=dy/d*v.sp*dt}
  smokeT+=dt;if(smokeT>.45){smokeT=0;for(const b of S.b)if(B[b.k].smoke&&Math.random()<.7)smoke.push({...smokeOrigin(b),life:2.4,max:2.4})}

}
function draw(now){
  const k=K();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=curSeason===3?'#c1d2cb':'#829c70';ctx.fillRect(0,0,cv.width,cv.height);

    ctx.drawImage(SP.yard[b.k],b.x*TS-4,b.y*TS+24,40,14)}
  for(const b of S.b)drawPlotDetails(b);
  const L=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=S.o[y*MW+x];if(o)L.push({z:y*TS+15,o,x,y})}

    else if(d.b){const b=d.b,img=b.k==='farm'?SP.b.farm[Math.floor(S.time/9+b.id)%3]:SP.b[b.k],X=b.x*TS,top=b.y*TS+32-img.height/ART;
      ctx.save();if(b.id===movingId)ctx.globalAlpha=.35;

    ctx.globalAlpha=ok?.85:.55;ctx.drawImage(img,X,Y+32-img.height/ART,img.width/ART,img.height/ART);ctx.globalAlpha=1;

    if(f.icon)ctx.drawImage(ICON[f.icon],tx,sy-isz/2,isz,isz);ctx.lineWidth=3*dpr;ctx.strokeStyle='#6e725bef';ctx.strokeText(f.txt,tx+(f.icon?isz+4*dpr:0),sy);ctx.fillStyle=f.col;ctx.fillText(f.txt,tx+(f.icon?isz+4*dpr:0),sy)}
  ctx.globalAlpha=1;
}
