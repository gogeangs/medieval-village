  for(let y=0;y<MH;y++){const rx=riverX(y);t[y*MW+rx]=2;t[y*MW+rx+1]=2}
  for(let x=0;x<MW-3;x++){const i=14*MW+x;t[i]=t[i]===2?3:1}
  for(let y=6;y<23;y++){const i=y*MW+19;if(!t[i])t[i]=1}

}

const pointers=new Map();
let ptr=null,pinch=null;
// Rebase from the current camera whenever the active fingers change.
// A gesture that used two fingers stays a drag until all fingers are lifted.
function rebaseGesture(suppressTap=true){
  ptr=null;pinch=null;
  const active=[...pointers.entries()];
  if(active.length>=2){
    const [[id,a],[other,b]]=active,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={id,other,distance:Math.hypot(b.x-a.x,b.y-a.y),zoom,
      world:{x:cam.x+m.x/css(),y:cam.y+m.y/css()}};
  }else if(active.length){
    const [id,p]=active[0];ptr={id,x:p.x,y:p.y,cx:cam.x,cy:cam.y,drag:suppressTap};
  }
}
function resetGesture(){
  const ids=[...pointers.keys()];pointers.clear();ptr=null;pinch=null;
  for(const id of ids)if(cv.hasPointerCapture?.(id))cv.releasePointerCapture(id);
}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  rebaseGesture(pointers.size>1);
});
cv.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){
    if(e.pointerId!==pinch.id&&e.pointerId!==pinch.other)return;
    const a=pointers.get(pinch.id),b=pointers.get(pinch.other),distance=Math.hypot(b.x-a.x,b.y-a.y);
    if(pinch.distance<2){rebaseGesture();return}
    setZoomAt(pinch.zoom*distance/pinch.distance,{x:(a.x+b.x)/2,y:(a.y+b.y)/2},pinch.world);
  }else if(ptr&&e.pointerId===ptr.id){
    const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
    if(!ptr.drag&&Math.hypot(dx,dy)>8)ptr.drag=true;
    if(ptr.drag){cam.x=ptr.cx-dx/css();cam.y=ptr.cy-dy/css();clampCam()}
  }
});
const endPtr=e=>{
  if(!pointers.has(e.pointerId))return;
  const isTap=pointers.size===1&&ptr?.id===e.pointerId&&!ptr.drag&&e.type==='pointerup';
  pointers.delete(e.pointerId);
  if(cv.hasPointerCapture?.(e.pointerId))cv.releasePointerCapture(e.pointerId);
  rebaseGesture();
  if(isTap)tap(e.clientX,e.clientY);
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('lostpointercapture',endPtr);
addEventListener('blur',resetGesture);
cv.addEventListener('wheel',e=>{e.preventDefault();if(!pinch&&e.deltaY)setZoom(e.deltaY<0?1:-1)},{passive:false});

function hitAt(wx,wy){
  const candidates=[];
  for(const b of S.b){const img=bImg(b);candidates.push({z:bBase(b)-1,img,x:b.x*TS,y:bBase(b)-img.height/ART,id:b.id})}
  for(let y=Math.max(0,Math.floor(wy/TS)-1);y<Math.min(MH,Math.floor(wy/TS)+4);y++)for(let x=Math.max(0,Math.floor(wx/TS)-1);x<Math.min(MW,Math.floor(wx/TS)+2);x++){
    const o=S.o[y*MW+x];if(!o)continue;const img=SP[o.k],w=img.width/ART,h=img.height/ART;
    candidates.push({z:y*TS+15,img,x:x*TS+(TS-w)/2,y:y*TS+TS-h,tx:x,ty:y});
  }
  for(const d of S.decor){const def=DECOR[d.k],img=SP.decor[d.k];candidates.push({z:(d.y+def.size)*TS-1,img,x:d.x*TS+(def.size*TS-def.w)/2,y:(d.y+def.size)*TS-def.h,decorId:d.id})}
  if(S.dg&&S.dg.x!=null){const G=caveGeom();candidates.push({z:G.base-1,img:G.img,x:G.x,y:G.y,cave:true,tx:S.dg.x,ty:S.dg.y})}
  if(S.rdg)for(const[id,v]of Object.entries(S.rdg))if(v.x!=null){const G=rdGeom(id);candidates.push({z:G.base-1,img:G.img,x:G.x,y:G.y,rdg:id,tx:v.x,ty:v.y})}
  for(const l of LANDMARKS){const v=S.lm[l.id];if(!v)continue;const img=lmImg(l.id,v.st>=3),G=lmGeom(l,v,img);candidates.push({z:G.base-1,img,x:G.x,y:G.y,lm:l.id,tx:v.x,ty:v.y})}
  const guest=visitorAnchor(),visit=currentVisit();if(guest&&visit)candidates.push({z:guest.y,img:SP.visitors[visit.who],x:guest.x-4,y:guest.y-16,visitor:true});
  candidates.sort((a,b)=>b.z-a.z);
  for(const c of candidates){const x=Math.floor((wx-c.x)*ART),y=Math.floor((wy-c.y)*ART);if(x<0||y<0||x>=c.img.width||y>=c.img.height)continue;
    if(!c.img.hitAlpha)c.img.hitAlpha=c.img.getContext('2d').getImageData(0,0,c.img.width,c.img.height).data;
    if(c.img.hitAlpha[(y*c.img.width+x)*4+3]>128)return c;
  }
  return null;
}
function tap(cx,cy){const wx=cam.x+cx/css(),wy=cam.y+cy/css(),tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);
  if(mode==='road'){toggleRoad(tx,ty);return}
  if(mode==='wall'){toggleWall(tx,ty);return}
  if(mode==='hand'){{const wi=ty*MW+tx,w0=wallAt(wi),w1=ty+1<MH?wallAt(wi+MW):null;if(w0&&w0.t>=3&&!OCC[wi]){openSheet('wall:'+wi);return}if(w1&&w1.t===4){openSheet('wall:'+(wi+MW));return}}const guest=visitorAnchor();if(guest&&Math.abs(wx-guest.x)<=6&&wy>=guest.y-25&&wy<=guest.y-16){openVisitors();return}const hit=hitAt(wx,wy);if((!hit||hit.tx!=null)&&!cellOpen(hit?hit.tx:tx,hit?hit.ty:ty)){openSheet('zone:'+zoneAt(hit?hit.tx:tx,hit?hit.ty:ty).id);return}if(hit){if(hit.visitor)openVisitors();else if(hit.decorId)openSheet('decor:'+hit.decorId);else if(hit.id)openSheet(hit.id);else if(hit.cave)openSheet('dungeon');else if(hit.rdg)openSheet('rdg:'+hit.rdg);else if(hit.lm)openSheet('lm:'+hit.lm);else harvest(hit.tx,hit.ty);return}if(T(tx,ty)>=0&&caveAt(ty*MW+tx)){openSheet('dungeon');return}{const rd=T(tx,ty)>=0?rdAt(ty*MW+tx):null;if(rd){openSheet('rdg:'+rd);return}}const lmHere=T(tx,ty)>=0?lmAtIdx(ty*MW+tx):null;if(lmHere){openSheet('lm:'+lmHere.id);return}const id=T(tx,ty)>=0?OCC[ty*MW+tx]:0;if(id){openSheet(id);return}const decoration=T(tx,ty)>=0?DOCC[ty*MW+tx]:0;if(decoration){openSheet('decor:'+decoration);return}if(T(tx,ty)>=0&&harvest(tx,ty))return;closeSheet();return}
  const size=mode==='decor'?DECOR[decorKind].size:2;ghost={x:Math.round(wx/TS-size/2),y:Math.round(wy/TS-size/2)};updateConfirm();keepPlacementVisible()}

const ROAD_COST=0;let BASE_TILES=null,roadDirty=new Map(),roadTimer=null,roadTier=1;
const ROAD_TIERS={1:{n:'흙길',cost:{}},2:{n:'자갈길',cost:{stone:2}},3:{n:'돌길',cost:{stone:4,gold:2}}};
const roadLv=i=>TILES&&TILES[i]===1?(S.roadLv?.[i]||1):0;
function normalizeRoadLv(){const o=S.roadLv&&typeof S.roadLv==='object'&&!Array.isArray(S.roadLv)?S.roadLv:{};S.roadLv={};for(const k in o){const i=+k,l=o[k];if(Number.isInteger(i)&&TILES[i]===1&&(l===2||l===3))S.roadLv[i]=l}}
function roadBonus(b){const[fw,fh]=fp(b.k);let best=1;for(let y=b.y-1;y<=b.y+fh;y++)for(let x=b.x-1;x<=b.x+fw;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if((x<b.x||x>=b.x+fw)&&(y<b.y||y>=b.y+fh))continue;const l=roadLv(y*MW+x);if(l>best)best=l}return best===3?1.1:best===2?1.05:1}
function normalizeRoads(d,base){const seen=new Set();d.roads=(Array.isArray(d.roads)?d.roads:[]).filter(i=>Number.isInteger(i)&&i>=0&&i<MW*MH&&base[i]===0&&!seen.has(i)&&seen.add(i));return d}
function applyRoads(){for(const i of S.roads)if(BASE_TILES[i]===0)TILES[i]=1;
  PATHS=[];for(let y=0;y<MH;y++)for(let x=riverX(y)+2;x<MW;x++)if(TILES[y*MW+x]===1&&cellOpen(x,y))PATHS.push([x,y])}
const isPlayerRoad=i=>S.roads.includes(i);
function scheduleGround(delay=900){clearTimeout(roadTimer);roadTimer=setTimeout(()=>{rebuildGround();roadDirty.clear()},delay)}
function toggleRoad(tx,ty){if(tx<0||ty<0||tx>=MW||ty>=MH)return;if(!cellOpen(tx,ty)){toast('안개 속 땅은 먼저 개척해요');return}if(LMOCC[ty*MW+tx]){toast('명소 자리에는 길을 낼 수 없어요');return}if(wallAt(ty*MW+tx)){toast('성벽이 있는 칸이에요. 성벽 공사에서 먼저 헐어요');return}const i=ty*MW+tx,cur=roadLv(i),T=ROAD_TIERS[roadTier];
  if(roadTier>1&&cur){if(cur>=roadTier){toast(cur===roadTier?`이미 ${T.n}이에요`:'더 좋은 길이에요');return}if(BASE_TILES[i]===3)return;if(!can(T.cost)){toast(`${missingCost(T.cost)} 부족해요`);return}
    pay(T.cost);S.roadLv[i]=roadTier;roadDirty.set(i,roadTier===3?'stone':'gravel');chips(tx*TS+8,ty*TS+10,roadTier===3?'#a9a39a':'#bdb6a4',6);applyRoads();scheduleGround();updateHUD();save();return}
  if(isPlayerRoad(i)){if(roadTier>1)return;if(OCC[i]||DOCC[i]){toast('건물이나 장식이 있는 길은 지울 수 없어요');return}
    const l=S.roadLv[i]||1;if(l>1){const c=ROAD_TIERS[l].cost;for(const k in c)S.r[k]+=Math.floor(c[k]/2)}delete S.roadLv[i];
    S.roads=S.roads.filter(v=>v!==i);TILES[i]=0;roadDirty.set(i,'grass')}
  else{if(BASE_TILES[i]!==0){toast(BASE_TILES[i]===3?'다리는 바꿀 수 없어요':BASE_TILES[i]===1?'이미 길이에요':'물 위에는 길을 낼 수 없어요');return}
    if(S.o[i]){toast('나무나 바위를 먼저 치워 주세요');return}
    if(OCC[i]||DOCC[i]){toast('건물이나 장식이 없는 땅에 놓아 주세요');return}
    if(!can(T.cost)){toast(`${missingCost(T.cost)} 부족해요`);return}
    pay(T.cost);S.roads.push(i);TILES[i]=1;if(roadTier>1)S.roadLv[i]=roadTier;roadDirty.set(i,roadTier===3?'stone':roadTier===2?'gravel':'path');chips(tx*TS+8,ty*TS+10,'#c5b487',5)}
  applyRoads();scheduleGround();updateHUD();save()}
